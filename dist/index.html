function start(){mutate(()=>{s.players.forEach(p=>p.role='未確認');s.phase='night';log('遊戲開始；第一夜依睜眼順序登記身分');if(isBrothersTen()){log('模板：'+boardLabel());log('規則：'+rulesText())}})}
function note(){let text=String(readHostValue('note')).trim();if(text)mutate(()=>log('備註：'+text))}
function reset(){if(!confirm('開新局會清除目前進度。請先匯出需要保留的紀錄。確定繼續？'))return false;s=fresh();tab='play';save();render();return true;}

function registrationUI(){const k=nightSteps()[viewState().step];if(!registrationNeeded(k))return '';const list=viewState().players.filter(p=>p.role==='未確認');return `<span class="eyebrow">FIRST NIGHT · 身分登記</span><h2 style="margin-top:18px">${titles[k]} · 確認睜眼者</h2><p class="callout">「${k==='meet'?'狼兄、狼弟':k==='wolves'?'參與今晚狼刀的狼人':titles[k]}請睜眼。」</p><p>${k==='meet'?'請狼兄、狼弟分別以手勢示意身分。':k==='wolves'?`狼兄 ${who(role('狼兄').id)} 已登記，請選擇${viewState().variant==='wolfking10'?'一位普通狼王':'另外兩位普通狼人'}。狼弟不睜眼。`:'選擇實際睜眼的玩家，登記後接著執行本晚行動。'}</p>${brotherReg(k).map((r,i)=>`<label>${r}${r==='狼人'?' '+(i+1):''}</label><select id="reg${i}">${options(list,0,'請選擇座號')}</select>`).join('')}<div class="notice">只記錄目前睜眼者。剩餘玩家暫不推定為平民。</div><div class="footerbar"><button onclick="backNight()" ${!viewState().step?'disabled':''}>← 上一步</button><button class="primary" onclick="registerRoles()">確認身分，繼續本階段 →</button></div>`}
function nightUI(){const registration=registrationUI();if(registration)return registration;let steps=nightSteps(),k=steps[viewState().step],body='',call=`「${titles[k]}請睜眼。」`,d=viewState().draft,t=tradeNow();
if(k==='meet'){call='「狼兄、狼弟請睜眼，確認彼此身分。」';body=`<div class="notice">狼兄 ${who(role('狼兄').id)} ／ 狼弟 ${who(role('狼弟').id)}<br>互認後，兩人都閉眼。狼弟今晚不進狼隊。</div>`}
if(k==='merchant'){body=role('黑市商人').alive&&!viewState().trade?selectField('trade','選擇交易對象',alive().filter(p=>p.role!=='黑市商人'),'今晚不交易')+`<label>禮物</label><select onchange="setDraft('gift',this.value)"><option value="">選擇禮物</option>${['查驗','毒藥','獵槍'].map(x=>`<option ${d.gift===x?'selected':''}>${x}</option>`).join('')}</select>`:'<div class="notice">已出局或已完成交易。保留口令與停頓，不執行操作。</div>'}
if(k==='wolves'){call=WOLF_CALL;let pack=wolfPack();body=`<div class="notice">今晚睜眼：${pack.map(p=>who(p.id)).join('、')||'無'}<br>${viewState().revenge&&viewState().n>viewState().revenge?'狼弟已加入狼隊。':'狼弟請保持閉眼。'}</div>`+(pack.length?selectField('kill','狼隊刀口',alive().filter(p=>viewState().rules.broSelf||p.role!=='狼兄'),'空刀'):'')}
if(k==='brother'){call=BROTHER_CALL;body=viewState().revenge===viewState().n&&role('狼弟').alive?`<div class="notice">今晚是復仇夜，狼弟必須單獨選一人。下一晚才加入狼隊。</div>`+selectField('revenge','復仇刀目標',alive(),'請選擇（不可空刀）'):'<div class="notice">今晚無獨立復仇刀。保留口令與停頓。</div>'}
if(k==='witch'){const canSelf=viewState().rules.self==='yes'||viewState().rules.self==='first'&&viewState().n===1;const canHeal=viewState().heal&&d.kill&&(canSelf||d.kill!==role('女巫').id);body=role('女巫').alive?`<div class="notice">${viewState().heal?`普通狼刀：${who(d.kill)}`:'解藥已使用，不再告知刀口。'}<br>解藥 ${viewState().heal?'● 可用':'○ 已用'} ／ 毒藥 ${viewState().poison?'● 可用':'○ 已用'}<br>復仇刀不告知女巫。</div>${canHeal?`<label class="check"><input type="checkbox" ${d.save?'checked':''} onchange="viewState().draft.poison=0;setDraft('save',this.checked)">使用解藥</label>`:''}${viewState().poison&&!d.save?selectField('poison','毒藥目標'):''}`:'<div class="notice">女巫已出局，保留口令與停頓。</div>'}
if(k==='seer'){body=role('預言家').alive?selectField('check','查驗對象',alive(),'請選擇')+(d.check?`<div class="notice">${who(d.check)} 的查驗結果：<strong>${result(d.check)}</strong></div>`:''):'<div class="notice">預言家已出局，保留口令與停頓。</div>'}
if(k==='walk'){call='「所有人保持閉眼。」';body=`<div class="notice">固定繞行一整圈。${t&&t.night===viewState().n&&t.success?`<br>輕拍 ${who(t.id)}，通知成為幸運兒。`:'<br>今晚沒有新幸運兒，不拍任何人。'}${t&&t.night===viewState().n&&!t.success?'<br>交易失敗，不通知狼人。':''}</div>`}
if(k==='lucky'){body=t?.success&&player(t.id).alive?`<div class="notice">幸運兒：${who(t.id)}<br>禮物：${t.gift} ${t.used?'（已使用）':''}<br>${t.night===viewState().n?'今晚只通知。查驗／毒藥下一晚可用；槍明天天亮後生效。':''}</div>`:'';if(t?.success&&player(t.id).alive&&t.night<viewState().n&&!t.used){if(t.gift==='查驗')body+=selectField('luckyCheck','是否使用一次查驗')+(d.luckyCheck?`<div class="notice">結果：${result(d.luckyCheck)}</div>`:'');if(t.gift==='毒藥')body+=selectField('luckyPoison','是否使用一次毒藥');if(t.gift==='獵槍')body+=`<div class="notice">槍狀態：${gunOK(t.id)?'可開槍':'中毒，不能開槍'}</div>`}if(!body)body='<div class="notice">無可行動幸運兒。保留口令與停頓。</div>'}
if(k==='hunter')body=`<div class="notice">獵人：${who(role('獵人').id)}<br>${role('獵人').alive?`開槍狀態：${gunOK(role('獵人').id)?'可開槍':'中毒，不能開槍'}`:'已出局；保留口令與停頓。'}</div>`;
if(k==='review'){call='夜間行動已完成';let c=outcomes();body=`<p>以下僅供上帝確認；第一天先選警長，再公布死訊。</p><div class="notice">${Object.keys(c).length?Object.entries(c).map(([id,reasons])=>`${who(id)}：${reasons.join(' ＋ ')}`).join('<br>'):'平安夜'}</div><p class="tiny">夜間行動同時結算。新幸運槍若交易當晚死亡，本工具採「槍尚未生效，不能開槍」。</p>`}
return `<div class="row between"><span class="eyebrow">NIGHT ${String(viewState().n).padStart(2,'0')}</span><span class="pill">${viewState().step+1} / ${steps.length}</span></div><div class="steps">${steps.map((_,i)=>`<i class="${i<=viewState().step?'done':''}"></i>`).join('')}</div><h2>${titles[k]}</h2>${viewState().n===1&&REG[k]?`<button onclick="editRegistration()">修正本階段身分</button>`:''}<p class="callout">${call}</p>${body}<div class="footerbar"><button onclick="backNight()" ${!viewState().step?'disabled':''}>← 上一步</button><button class="primary" onclick="nextNight()">${k==='review'?'確認夜間紀錄':'確認並繼續 →'}</button></div>`}
function electionUI(){return `<span class="eyebrow">SHERIFF ELECTION</span><h2 style="margin-top:15px">警長競選</h2><p>先選警長，再公布昨夜死訊。勾選上警者；退水時取消勾選。只有未上警玩家投票。</p><div class="votes">${alive().map(p=>`<label class="check"><input type="checkbox" ${viewState().candidates.includes(p.id)?'checked':''} onchange="candidate(${p.id},this.checked)">${who(p.id)}</label>`).join('')}</div>${voteUI(true)}<div class="row" style="margin-top:20px"><button onclick="noSheriff()">無警長，進入天亮</button><button class="danger" onclick="boom()">競選中狼人自爆</button></div>`}
function voteUI(elect=false){let targets=(elect?viewState().candidates:alive().map(p=>p.id));if(viewState().pk.length)targets=viewState().pk;let voters=alive().filter(p=>elect?!viewState().candidates.includes(p.id):!viewState().pk.includes(p.id));return `<h3 style="margin-top:24px">${viewState().pk.length?'平票 PK · ':''}逐人記票 <span class="muted tiny">第 ${viewState().voteRound} 輪</span></h3><div class="votes">${voters.map(p=>`<div><label>${who(p.id)}${!elect&&viewState().sheriff===p.id?' · 1.5 票':''}</label><select onchange="recordVote(${p.id},Number(this.value))"><option value="-1">尚未記錄</option>${options(targets.map(player),viewState().votes[p.id]??-1,'棄票')}</select></div>`).join('')}</div><button style="margin-top:20px" class="primary" onclick="countVotes(${elect})">${elect?'結算警長票':'結算放逐票'}</button>`}
function pendingUI(){let h=viewState().pending[0];if(h)return `<h2>處理出局技能</h2><div class="notice">${who(h.id)} 可開槍，剩餘 ${h.guns} 槍。</div><select id="shot">${options(alive(),0,'不開槍')}</select><button class="primary" style="margin-top:18px" onclick="shoot()">確認開槍／放棄</button>`;if(viewState().badge)return `<h2>警徽處理</h2><p>警長 ${who(viewState().sheriff)} 已出局，請移交或撕毀警徽。</p><select id="badge">${options(alive(),0,'撕毀警徽')}</select><button class="primary" style="margin-top:18px" onclick="badge()">確認警徽處理</button>`;return ''}

function setupUI(){return `<span class="eyebrow">BEFORE THE NIGHT</span><h2 style="margin-top:14px">安排今晚的座位</h2><p>只需填寫座位暱稱。發牌後不用查看身分；第一夜依各角色睜眼時逐一登記。</p><div class="setupgrid">${viewState().players.map(p=>`<div class="seatsetup"><span class="number">${String(p.id).padStart(2,'0')}</span><input aria-label="${p.id}號暱稱" placeholder="玩家暱稱（選填）" value="${esc(p.name)}" onchange="GameEngine.setPlayerName(${p.id},this.value)"><span class="tiny muted" style="grid-column:2">身分待第一夜確認</span></div>`).join('')}</div><details open><summary>本局規則 · 開始前一起確認</summary>${viewState().board==='brothers'?`<label>人數與配置</label><select onchange="GameEngine.configure('brothers',this.value)">${['standard12','wolfking10'].map(v=>`<option value="${v}" ${viewState().variant===v?'selected':''}>${boardConfiguration('brothers',v).label}</option>`).join('')}</select>${viewState().variant==='wolfking10'?'<p>狼兄、狼弟、普通狼王＋4 神＋3 民。普通狼王非中毒、非自爆死亡且勝負未定可開槍；不設夜間報槍。</p>':''}`:''}<label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)"><option value="no" ${viewState().rules.self==='no'?'selected':''}>全程不可自救</option><option value="first" ${viewState().rules.self==='first'?'selected':''}>僅首夜可自救</option><option value="yes" ${viewState().rules.self==='yes'?'selected':''}>全程可自救</option></select><label class="check"><input type="checkbox" ${viewState().rules.broSelf?'checked':''} onchange="GameEngine.setRule('broSelf',this.checked)">允許狼隊自刀狼兄</label><label class="check"><input type="checkbox" ${viewState().rules.double?'checked':''} onchange="GameEngine.setRule('double',this.checked)">雙爆吞警徽（取消則單爆吞警徽）</label><label class="check"><input type="checkbox" ${viewState().rules.revengeSave?'checked':''} onchange="GameEngine.setRule('revengeSave',this.checked)">同刀時解藥可一併救下復仇刀（預設不可）</label><p class="tiny">固定口令：狼隊每晚都喊「參與今晚狼刀的狼人請睜眼」，狼兄會與小狼共同睜眼；狼弟復仇夜不入狼隊，再下一晚才加入共同狼刀。狼弟環節每晚固定喊完整口令，由手勢通知是否有刀，無技能與已出局也保留相同停頓。上帝專用狀態資訊不可朗讀。固定採用：屠邊局；警長 1.5 票；狼兄不可自爆；女巫每夜最多一瓶藥，用過解藥不再看刀口；復仇刀不可空刀且不報給女巫；交易狼弟也失敗；幸運技能一次性，查驗／毒隔夜可用，槍隔日生效；中毒不能開槍；交易當晚死亡的新幸運兒不能開槍；平民獲贈技能仍屬民邊；神職與幸運槍可疊加；全部待處理槍結束後判勝；PK 再平票則無人當選／放逐。</p></details><div class="footerbar"><span class="tiny muted">${viewState().board==='brothers'&&viewState().variant==='wolfking10'?'3 狼 · 4 神 · 3 民':'4 狼 · 4 神 · 4 民'}</span><button class="primary" onclick="start()">天黑請閉眼，開始認牌 →</button></div>`}
function logsUI(){return `<div class="row between"><h2>全局時間線</h2><button onclick="download()">匯出紀錄</button></div>${viewState().logs.length?viewState().logs.slice().reverse().map(l=>`<div class="log"><small>${esc(l.period)} · ${esc(l.at)}</small><div>${esc(logText(l))}</div></div>`).join(''):'<p>尚未開始。確認每個行動後，紀錄會自動保留。</p>'}`}
function mainUI(){if(tab==='log')return logsUI();if(viewState().phase==='setup')return setupUI();if(viewState().phase==='end')return `<span class="eyebrow">THE NIGHT HAS ENDED</span><h1>${viewState().winner}</h1><p>本局完成。全局時間線已保留，可以匯出復盤紀錄。</p><div class="row"><button class="primary" onclick="tab='log';render()">查看完整復盤</button><button onclick="download()">匯出紀錄</button><button onclick="reset()">開始新局</button></div>`;if(viewState().pending.length||viewState().badge)return pendingUI();if(viewState().phase==='night')return nightUI();if(viewState().phase==='election')return electionUI();if(viewState().phase==='dawn')return `<span class="eyebrow">DAWN</span><h2 style="margin-top:15px">天亮了，請睜眼</h2><div class="notice">${Object.keys(viewState().nightResult||{}).length?Object.keys(viewState().nightResult).map(who).join('、')+' 出局。':'昨夜平安夜。'}</div><p>只公布座號，不公布死因。確認後處理開槍與警徽。</p><button class="primary" onclick="settle()">公布死訊，進入白天 →</button>`;return dayUI()}
function render(){if(hidden){$('app').innerHTML='<div class="overlay"><div class="moon">☾</div><h1>天黑，請閉眼</h1><p>主持資訊已隱藏</p><button onclick="hidden=false;render()">返回上帝控制台</button></div>';return}let status=viewState().phase==='setup'?'準備開局':viewState().phase==='end'?'遊戲結束':`第 ${viewState().n} ${viewState().phase==='night'?'夜':'天'}`;$('app').innerHTML=`<header><div><div class="brand"><span>☾</span>月夜議會</div><div class="sub">WEREWOLF · MODERATOR CONSOLE</div></div><button onclick="hidden=true;render()">◉ 隱藏身分</button></header><div class="wrap"><div class="top"><div><div class="eyebrow">THE MODERATOR'S DESK</div><h1>把節奏，留在你手上。</h1><div class="muted">12 人警長 · ${viewState().board==='mechanical'?'機械狼 × 通靈師':'狼兄狼弟 × 黑市商人'}</div></div><span class="pill">${status} · ${saveError?'儲存失敗，請匯出紀錄':'本機自動儲存'}</span></div><div class="layout"><main><div class="tabs"><button class="${tab==='play'?'active':''}" onclick="tab='play';render()">遊戲控制台</button><button class="${tab==='log'?'active':''}" onclick="tab='log';render()">全局紀錄 <span class="tiny">${viewState().logs.length}</span></button><button onclick="undo()" ${!viewState().canUndo?'disabled':''}>↶ 撤回</button></div><div class="panel">${mainUI()}</div>${viewState().phase!=='setup'?`<div class="panel"><h3>上帝筆記</h3><div class="row"><input id="note" placeholder="記下發言、爭議或現場裁定…" style="flex:1;min-width:180px"><button onclick="note()">加入紀錄</button></div></div>`:''}</main><aside><div class="panel"><div class="row between"><h3>座位總覽</h3><span class="tiny muted">${alive().length} / ${viewState().players.length} 存活</span></div><p class="tiny muted">${viewState().players.some(p=>p.role==='未確認')?`尚有 ${viewState().players.filter(p=>p.role==='未確認').length} 位身分未確認`:'身分已全部確認'}</p><div class="seats">${viewState().players.map(p=>`<div class="seat ${p.alive?'':'dead'}"><span class="number">${String(p.id).padStart(2,'0')}</span>${viewState().sheriff===p.id?' ♛':''}<span class="name">${esc(p.name||'玩家 '+p.id)}</span><span class="role ${wolf(p)?'wolf':''}">${p.role}${p.alive?'':' · 出局'}${viewState().trade?.success&&viewState().trade.id===p.id?' · 幸運':''}</span></div>`).join('')}</div><div class="row between" style="margin-top:20px"><div><span class="stat">${alive().filter(wolf).length}</span> <span class="tiny muted">狼</span></div><div><span class="stat">${alive().filter(p=>!wolf(p)&&!['平民','未確認'].includes(p.role)).length}</span> <span class="tiny muted">神</span></div><div><span class="stat">${alive().filter(p=>p.role==='平民').length}</span> <span class="tiny muted">民</span></div></div></div><div class="panel"><div class="row between"><h3>發言計時</h3><span class="tiny muted">無提示音</span></div><div class="timer" id="timer">${timeText()}</div><div class="row" style="margin-top:15px"><button onclick="ticking=!ticking;render()">${ticking?'暫停':'開始'}</button><button onclick="timer=90;ticking=false;render()">重設</button><select aria-label="發言秒數" style="width:auto" onchange="timer=+this.value;ticking=false;render()"><option value="">時長</option><option value="60">60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option></select></div></div><div class="panel"><h3>主持提醒</h3><p class="tiny">每晚固定喊完所有角色。已出局或無技能的角色，仍保留相近停頓。<br>修改先前夜間選擇時，後續行動會清空並重新確認。</p><div class="row"><button onclick="download()">匯出</button><button class="danger" onclick="reset()">開新局</button></div><p class="tiny">進度保存在目前瀏覽器；換裝置不會同步。隱藏按鈕用於防止旁觀，不是密碼鎖。</p></div></aside></div></div>`}
function timeText(){return Math.floor(timer/60).toString().padStart(2,'0')+':'+(timer%60).toString().padStart(2,'0')}

let lastTick=Date.now();setInterval(()=>{let now=Date.now();if(ticking){let elapsed=Math.floor((now-lastTick)/1000);if(elapsed){timer=Math.max(0,timer-elapsed);lastTick+=elapsed*1000;if(!timer)ticking=false;if($('timer'))$('timer').textContent=timeText();if(!timer)render()}}else lastTick=now},250);

function setBoardConfiguration(board,variant='standard12'){
 if(s.phase!=='setup'||!Object.hasOwn(BOARD_TEMPLATES,board)||!['standard12','wolfking10'].includes(variant)||variant==='wolfking10'&&board!=='brothers')return false;
 const count=boardConfiguration(board,variant).playerCount;
 if(s.players.slice(count).some(p=>p.name)&&!confirm('縮編會移除多出的座位暱稱，確定切換？'))return false;
 mutate(()=>{s.board=board;s.variant=variant;s.players=Array.from({length:count},(_,i)=>({id:i+1,name:s.players[i]?.name||'',role:'未確認',alive:true}));ensureMech();});return true;
}

function ordinaryWolvesGone(){return s.players.filter(p=>p.role==='狼人').length===3&&!alive().some(p=>p.role==='狼人');}

// Shared night briefing, computed from the same effective outcomes as settlement.
function hunterWakeState(){const p=role('獵人');if(!p)return {id:0,available:false,reason:'本局獵人未在場',note:'保留固定口令與相同停頓。'};if(!p.alive)return {id:p.id,available:false,reason:'獵人已出局',note:'保留固定口令與相同停頓。'};const causes=outcomes()[p.id]||[];let reason='未中毒，技能可用';if(isDream()&&dreamFeared(p.id))reason='當夜被恐懼';else if(causes.some(c=>c.includes('毒')))reason='當夜中毒';else if(causes.includes('殉情'))reason='當夜為殉情者';const available=gunOK(p.id);return {id:p.id,available,reason,note:available?'明早符合出局條件時可開槍。':'明早因本夜出局時不能開槍。'};}
function recordHunterBriefing(){if(s.phase!=='night'||nightSteps()[s.step]!=='hunter'||!role('獵人')?.alive)return;const st=hunterWakeState();s.draft.hunterBriefing={night:s.n,id:st.id,available:st.available,reason:st.reason};log(`已告知獵人 ${who(st.id)}：明早${st.available?'可以':'不可以'}開槍（${st.reason}）`);}

// Human-readable rules shared by the diary and text export.
function rulesText(r=s.rules,board=s.board,variant=s.variant){
 const parts=['女巫自救：'+({no:'全程不可自救',first:'僅首夜可自救',yes:'全程可自救'}[r.self]||'全程不可自救'), '警徽：'+(r.double===false?'單爆吞警徽':'雙爆吞警徽')];
 if(board==='brothers'&&variant==='wolfking10')parts.push('普通狼王：非中毒、非自爆死亡且勝負未定時可開一槍；不設夜間報槍環節');
 if(board==='classic')parts.push('白痴：首次放逐翻牌仍存活、無投票權，仍計入神邊；刀毒槍正常致死');
 if(board==='brothers')parts.push('狼兄自刀：'+(r.broSelf?'允許':'禁止'),'狼弟復仇刀：'+(r.revengeSave?'可被女巫解藥救回':'不可被女巫解藥救回'));
 if(['mechanical','whiteknight','bloodmoon'].includes(board))parts.push('守衛與女巫同守同救：'+(r.guardSaveDies===false?'刀口存活':'刀口死亡'));
 if(board==='mechanical')parts.push('未學習機械狼的查驗結果：'+(r.rawMech||'機械狼'),'機械守護：'+(r.shieldOnce===false?'每晚可用，不可連守':'整場僅一次'),'雙刀同目標：'+(r.doubleShieldPierce===false?'不穿透機械守護':'穿透機械守護'),'機械狼自爆：'+(r.mechBoom?'允許':'禁止'));
 return parts.join('；');
}
function logText(entry){
 const text=String(entry.text??'');
 const match=text.match(/^規則[：:]\s*(\{[\s\S]*\})\s*$/);
 if(!match)return text;
 try{const r=JSON.parse(match[1]);if(r&&typeof r==='object'&&!Array.isArray(r))return '規則：'+rulesText(r);}catch(e){}
 return '規則：舊紀錄格式不完整，請參照本局上帝手冊。';
}
function exportText(){return ['月夜議會｜狼人殺復盤','模板：'+boardLabel(),...s.players.map(p=>`${who(p.id)}：${p.role}`),'規則：'+rulesText(),'',...s.logs.map(l=>`[${l.period} ${l.at}] ${logText(l)}`)].join('\n');}

// Mechanical-wolf template. Shared daylight, voting, history and persistence stay in app.js.
const MECH_ROLES=['機械狼','狼人','狼人','狼人','通靈師','女巫','獵人','守衛','平民','平民','平民','平民'];
const base={nightSteps,nextNight,backNight,outcomes,kill,start};
const isMech=()=>s.board==='mechanical';
function ensureMech(){s.mech??={learned:null,poisonUsed:false,shieldUsed:false,doubleUsed:false,gunUsed:false,lastShield:0};s.guardLast??=0;for(const [k,v] of Object.entries({shieldOnce:true,rawMech:'機械狼',guardSaveDies:true,mechBoom:false,doubleShieldPierce:true}))if(s.rules[k]===undefined)s.rules[k]=v;}
function changeBoard(value){return setBoardConfiguration(value,'standard12');}
start=function(){if(!isMech())return base.start();mutate(()=>{ensureMech();s.players.forEach(p=>p.role='未確認');s.mechanicalFlowVersion=2;s.phase='night';log('模板：機械狼／通靈師；各角色睜眼時認牌與行動，學習結果最後告知');log('規則：'+rulesText())})};
const MREG={regMech:['機械狼'],regWolves:['狼人','狼人','狼人'],regSpirit:['通靈師'],regWitch:['女巫'],regHunter:['獵人'],regGuard:['守衛']};
const MTITLE={regMech:'機械狼認牌',regWolves:'普通狼人認牌',regSpirit:'通靈師認牌',regWitch:'女巫認牌',regHunter:'獵人認牌',regGuard:'守衛認牌',mechanical:'機械狼獨立行動',guard:'守衛',wolves:'普通狼隊',witch:'女巫',spirit:'通靈師',hunter:'獵人開槍狀態',mechGun:'機械狼開槍狀態',mechResult:'機械狼 · 學習結果',review:'夜間結算確認'};
const MECH_REG={mechanical:['機械狼'],guard:['守衛'],wolves:['狼人','狼人','狼人'],witch:['女巫'],hunter:['獵人'],spirit:['通靈師']};
function mechRegRoles(k){const rs=MECH_REG[k];return s.n===1&&rs&&rs.some(r=>s.players.filter(p=>p.role===r).length<rs.filter(x=>x===r).length)?rs:null}
nightSteps=function(){return isMech()?['mechanical','guard','wolves','witch','hunter','spirit','mechResult','review']:base.nightSteps()};
function learnedNow(){return s.mech.learned||(s.draft.learn?{id:s.draft.learn,role:player(s.draft.learn).role,night:s.n}:null)}
function spiritResult(id){const p=player(id);return p.role==='機械狼'?(learnedNow()?.role||s.rules.rawMech):p.role}
function inheritsKnife(){return ordinaryWolvesGone()}
function mRegister(k,selected){const rs=mechRegRoles(k),ids=selected||rs.map((_,i)=>+readHostValue('mr'+i));if(ids.some(id=>!id||!['未確認','平民',...rs].includes(player(id)?.role))||new Set(ids).size!==ids.length)return alert('請選擇不同且未被其他角色占用的座號。');mutate(()=>{s.players.forEach(p=>{if(rs.includes(p.role)||p.role==='平民')p.role='未確認'});ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`)});const ready=[...new Set(MECH_ROLES)].filter(r=>r!=='平民').every(r=>s.players.filter(p=>p.role===r).length===MECH_ROLES.filter(x=>x===r).length);if(ready){s.players.filter(p=>p.role==='未確認').forEach(p=>p.role='平民');log('八張特殊身分確認，剩餘四人為平民')}})}
outcomes=function(){if(!isMech())return base.outcomes();ensureMech();const d=s.draft,c={},add=(id,why)=>{if(+id&&player(id)?.alive)(c[id]??=[]).push(why)},shield=id=>+id===+d.mechShield&&!!d.mechShield,forced=d.double&&d.kill&&d.kill===d.extra;const targets=[...new Set([d.kill,d.double?d.extra:0].filter(Boolean))];for(const id of targets){if(forced){if(!shield(id)||s.rules.doubleShieldPierce)add(id,'雙刀同人強制擊殺');continue}if(shield(id))continue;const guarded=+d.guard===id,healed=+d.healTarget===id;if(guarded&&healed&&s.rules.guardSaveDies)add(id,'同守同救');else if(!guarded&&!healed)add(id,inheritsKnife()?'機械狼刀':'狼隊刀')}if(d.poison&&!shield(d.poison))add(d.poison,'女巫毒');if(d.mechPoison&&!shield(d.mechPoison))add(d.mechPoison,'機械毒');return c};
const M_FIELDS={mechanical:['learn','mechCheck','mechPoison','mechShield','kill','extra','double'],guard:['guard'],wolves:['kill'],witch:['healTarget','poison'],spirit:['spiritCheck']};
backNight=function(){if(!isMech())return base.backNight();if(!s.step)return;mutate(()=>{s.step--;const seq=nightSteps();for(const k of seq.slice(s.step+1)){const fields=k==='wolves'&&inheritsKnife()?[]:M_FIELDS[k]||[];fields.forEach(f=>delete s.draft[f])}})};
nextNight=function(){if(!isMech())return base.nextNight();ensureMech();const k=nightSteps()[s.step],d=s.draft,l=learnedNow();if(mechRegRoles(k))return mRegister(k);if(k==='mechanical'){if(d.learn&&d.learn===role('機械狼').id)return alert('機械狼不可學習自己。');if(d.double&&(!d.kill||!d.extra))return alert('使用雙刀必須指定兩刀目標，可選同一人。');if(role('機械狼').alive&&l?.role==='通靈師'&&l.night<s.n&&!d.mechCheck)return alert('請選擇機械狼的查驗對象。')}if(k==='spirit'&&role('通靈師').alive&&!d.spiritCheck)return alert('請選擇通靈師的查驗對象。');mutate(()=>{if(k==='hunter')recordHunterBriefing();if(k!=='review'){s.step++;return}const c=outcomes();log(`夜間刀口：${who(d.kill)}${d.double?'；第二刀 '+who(d.extra):''}`);log(`守衛 ${who(d.guard)}；機械守護 ${who(d.mechShield)}；女巫救 ${who(d.healTarget)}／毒 ${who(d.poison)}；機械毒 ${who(d.mechPoison)}`);if(d.learn&&!s.mech.learned){s.mech.learned=clone(l);log(`機械狼學習 ${who(d.learn)} → ${l.role}；${l.role==='獵人'?'獵槍當晚生效':l.role==='平民'?'無特殊技能':'技能下晚生效'}`)}if(d.mechCheck)log(`機械狼查驗 ${who(d.mechCheck)} → ${player(d.mechCheck).role}`);if(d.spiritCheck)log(`通靈師查驗 ${who(d.spiritCheck)} → ${spiritResult(d.spiritCheck)}`);s.guardLast=d.guard||0;s.mech.lastShield=d.mechShield||0;if(d.healTarget)s.heal=false;if(d.poison)s.poison=false;if(d.mechPoison)s.mech.poisonUsed=true;if(d.mechShield)s.mech.shieldUsed=true;if(d.double)s.mech.doubleUsed=true;s.nightResult=c;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1})};
kill=function(id,reason){if(!isMech())return base.kill(id,reason);ensureMech();const p=player(id),wasAlive=p?.alive;const gun=wasAlive&&p.role==='機械狼'&&learnedNow()?.role==='獵人'&&!s.mech.gunUsed&&!reason.includes('毒')&&reason!=='自爆';base.kill(id,reason);if(gun){s.mech.gunUsed=true;s.pending.push({id:p.id,guns:1})}if(wasAlive&&p.role==='狼人'&&!alive().some(x=>x.role==='狼人')&&role('機械狼')?.alive)log('普通狼人全數出局：機械狼於下一個夜晚繼承狼刀')};
// Preserve old saved games: absence of board means the original template.
s.board??='brothers';ensureMech();
// Night step indices from the earlier recognition-first prototype must be reconfirmed.
if(isMech()&&!s.mechanicalFlowVersion){if(s.phase==='night'){s.step=0;s.draft={};s.flowNotice='機械狼夜間順序已更新，請重新確認本夜行動；已確認的身分與先前回合保留。';}s.mechanicalFlowVersion=2;save();}

setupUI=function(){let html=baseViews.setupUI();const picker=`<div class="template-picker"><label>今晚的遊戲模板</label><select aria-label="遊戲模板" onchange="changeBoard(this.value)">${Object.entries(BOARD_TEMPLATES).map(([id,t])=>`<option value="${id}" ${viewState().board===id?'selected':''}>${t.label}</option>`).join('')}</select><p class="tiny">${isMech()?'機械狼＋3 狼人｜通靈師、女巫、獵人、守衛｜4 平民':viewState().variant==='wolfking10'?'狼兄、狼弟、狼王｜預言家、女巫、獵人、黑市商人｜3 平民':'狼兄、狼弟＋2 狼人｜預言家、女巫、獵人、黑市商人｜4 平民'}</p></div>`;html=html.replace('<div class="setupgrid">',picker+'<div class="setupgrid">');if(!isMech())return html;const a=html.indexOf('<details open>'),b=html.indexOf('</details>',a)+10;return html.slice(0,a)+`<details open><summary>機械狼模板規則 · 開局前確認</summary><label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)">${[['no','全程不可自救'],['first','僅首夜可自救'],['yes','全程可自救']].map(([v,t])=>`<option value="${v}" ${viewState().rules.self===v?'selected':''}>${t}</option>`).join('')}</select><label>未學習機械狼的通靈查驗結果</label><select onchange="GameEngine.setRule('rawMech',this.value)">${['機械狼','狼人'].map(r=>`<option ${viewState().rules.rawMech===r?'selected':''}>${r}</option>`).join('')}</select>${mechRuleCheck('shieldOnce','機械守護整場僅一次（取消則每晚可用、不可連守）')}${mechRuleCheck('guardSaveDies','普通守衛與女巫同守同救時，刀口死亡')}${mechRuleCheck('doubleShieldPierce','雙刀同一人也穿透機械守護')}${mechRuleCheck('mechBoom','允許機械狼自爆（自爆不能開槍）')}${mechRuleCheck('double','雙爆吞警徽（取消則單爆）')}<p class="tiny">按本桌規則：任一夜可學一次，選定後學習即成立，第二次睜眼才告知身分；主動技能次夜生效，獵槍當夜生效。學通靈可每晚驗具體角色；學女巫只有一瓶毒；機械守護擋刀與毒。普通狼人全數出局後，機械狼從下一個開始的夜晚接刀；學狼人後可在接刀時使用一次雙刀，同目標穿透普通守衛與解藥。通靈驗到已學習機械狼，回報學習身分。</p><p class="tiny">補充判定：普通守衛可自守、不可連守，只擋刀不擋毒；機械守護可自守。學習對象限存活玩家且不可自己。繼承狼刀可與已生效的主動技能同晚使用。雙刀時女巫看到兩個刀口，但一瓶解藥只能救一位；每晚最多一瓶藥。中毒不能開槍。屠邊、1.5 票、PK 再平票無人當選／放逐、全部待處理槍結束後判勝。</p><p class="tiny">每個角色首次睜眼時認牌，接著直接行動。順序：機械狼選學習 → 守衛 → 小狼 → 女巫 → 獵人確認狀態 → 通靈師查驗 → 機械狼得知學習結果。</p></details>`+html.slice(b)};
function mregUI(k){const rs=mechRegRoles(k),pool=viewState().players.filter(p=>p.role==='未確認'||p.role==='平民'||rs.includes(p.role));const existing=viewState().players.filter(p=>rs.includes(p.role));return `<p class="callout">「${rs[0]==='狼人'?'普通狼人，機械狼保持閉眼':rs[0]}請睜眼。」</p><p>先登記睜眼玩家，接著在同一回合執行技能。</p>${rs.map((r,i)=>`<label>${r}${rs.length>1?' '+(i+1):''}</label><select id="mr${i}">${options(pool,existing[i]?.id||0,'請選擇座號')}</select>`).join('')}`}
function mechanicalUI(){const m=role('機械狼'),d=viewState().draft,l=learnedNow();if(!m.alive)return '<div class="notice">機械狼已出局，保留口令與停頓。</div>';let html=`<div class="notice">機械狼：${who(m.id)}<br>${inheritsKnife()?'普通狼人已全數出局，今晚由機械狼單獨執行狼刀。':'普通狼人尚存活，機械狼不能刀人，且不與狼隊相認。'}</div>`;if(!viewState().mech.learned){html+=selectField('learn','是否發動一次學習',alive().filter(p=>p.id!==m.id),'今晚不學習');if(d.learn)html+=`<div class="notice">已選定 ${who(d.learn)}；學習已成立，第二次睜眼時才告知結果。</div>`}else html+=`<div class="notice">已學習：${who(l.id)}／${l.role}（第 ${l.night} 夜）</div>`;
if(l&&l.night<viewState().n){if(l.role==='通靈師'){html+=selectField('mechCheck','通靈查驗（每晚一次）',alive().filter(p=>p.id!==m.id),'請選擇');if(d.mechCheck)html+=`<div class="notice">查驗結果：${player(d.mechCheck).role}</div>`}if(l.role==='女巫')html+=viewState().mech.poisonUsed?'<p>機械毒藥已使用。</p>':selectField('mechPoison','機械毒藥');if(l.role==='守衛')html+=viewState().rules.shieldOnce&&viewState().mech.shieldUsed?'<p>機械守護已使用。</p>':selectField('mechShield','機械守護：可擋狼刀與毒藥',alive().filter(p=>viewState().rules.shieldOnce||p.id!==viewState().mech.lastShield));}
if(inheritsKnife()){html+=selectField('kill','繼承狼刀：第一刀');if(l?.role==='狼人'&&l.night<viewState().n&&!viewState().mech.doubleUsed){html+=`<label class="check"><input type="checkbox" ${d.double?'checked':''} onchange="viewState().draft.extra=0;setDraft('double',this.checked)">使用一次雙刀</label>`;if(d.double)html+=selectField('extra','第二刀（與第一刀相同則強制擊殺）',alive(),'請選擇第二刀')}}return html}
nightUI=function(){if(!isMech())return baseViews.nightUI();const steps=nightSteps(),k=steps[viewState().step],d=viewState().draft;let body='',call='';if(mechRegRoles(k))body=mregUI(k);else{call=`「${k==='mechanical'?'機械狼':k==='wolves'?'普通狼人，機械狼保持閉眼':(k==='mechGun'||k==='mechResult')?'機械狼':k==='hunter'?'獵人':MTITLE[k]}請睜眼。」`;if(k==='mechanical')body=mechanicalUI();if(k==='guard')body=role('守衛').alive?`<div class="notice">守衛：${who(role('守衛').id)}；上一晚守護：${who(viewState().guardLast)}。可自守，不可連守。</div>`+selectField('guard','本晚守護',alive().filter(p=>p.id!==viewState().guardLast)):'<div class="notice">守衛已出局；保留口令。</div>';if(k==='wolves'){const pack=alive().filter(p=>p.role==='狼人');body=`<div class="notice">普通狼人：${pack.map(p=>who(p.id)).join('、')||'無'}。機械狼不可睜眼。</div>`+(pack.length?selectField('kill','普通狼刀'):'<p>普通狼人全數出局，刀口已在機械狼環節記錄。</p>')}
if(k==='witch'){const canSelf=viewState().rules.self==='yes'||viewState().rules.self==='first'&&viewState().n===1;const targets=[...new Set([d.kill,d.double?d.extra:0].filter(Boolean))].map(player);body=role('女巫').alive?`<div class="notice">${viewState().heal?'今晚刀口：'+(targets.map(p=>who(p.id)).join('、')||'無'):'解藥已用，不再告知刀口。'}<br>解藥 ${viewState().heal?'可用':'已用'} ／ 毒藥 ${viewState().poison?'可用':'已用'}</div>`+(viewState().heal?selectField('healTarget','使用解藥：只能選一位',targets.filter(p=>canSelf||p.role!=='女巫'),'不用解藥'):'')+(viewState().poison&&!d.healTarget?selectField('poison','女巫毒藥'):''):'<div class="notice">女巫已出局；保留口令。</div>'}
if(k==='spirit')body=role('通靈師').alive?selectField('spiritCheck','查驗具體身分',alive().filter(p=>p.role!=='通靈師'),'請選擇')+(d.spiritCheck?`<div class="notice">對通靈師回報：<strong>${spiritResult(d.spiritCheck)}</strong></div>`:''):'<div class="notice">通靈師已出局；保留口令。</div>';
if(k==='hunter')body=`<div class="notice">獵人：${who(role('獵人').id)}<br>${!role('獵人').alive?'已出局，保留口令。':gunOK(role('獵人').id)?'槍狀態：可開槍':'槍狀態：中毒，不能開槍'}</div>`;
if(k==='mechGun'||k==='mechResult'){const l=learnedNow(),m=role('機械狼');body=`${d.learn?`<div class="notice">告知學習結果：${who(d.learn)} → ${l.role}。${l.role==='獵人'?'槍当夜生效。':'主動技能次夜生效。'}</div>`:''}<div class="notice">${!m.alive?'已出局，保留口令。':l?.role==='獵人'&&!viewState().mech.gunUsed?`已學獵人，槍當晚即生效。<br>槍狀態：${gunOK(m.id)?'可開槍':'中毒，不能開槍'}`:'無獵槍技能；保留口令與停頓。'}</div><p class="tiny">此環節在所有用毒之後，才能提供正確槍狀態。每晚固定呼叫。</p>`}
if(k==='review'){call='夜間行動已完成';const c=outcomes();body=`<p>確認後才進入警選／天亮。僅對玩家公布出局座號。</p><div class="notice">${Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)}：${rs.join('＋')}`).join('<br>'):'平安夜'}</div><p>普通守護 ${who(d.guard)}；機械守護 ${who(d.mechShield)}；解藥 ${who(d.healTarget)}。</p>`}}
return `<div class="row between"><span class="eyebrow">MECHANICAL · NIGHT ${viewState().n}</span><span class="pill">${viewState().step+1} / ${steps.length}</span></div><div class="steps">${steps.map((_,i)=>`<i class="${i<=viewState().step?'done':''}"></i>`).join('')}</div><h2>${MTITLE[k]}</h2>${call?`<p class="callout">${call}</p>`:''}${body}<div class="footerbar"><button onclick="backNight()" ${!viewState().step?'disabled':''}>← 上一步</button><button class="primary" onclick="nextNight()">${mechRegRoles(k)?'確認身分，繼續行動 →':k==='review'?'確認夜間紀錄':'確認並繼續 →'}</button></div>`};

// Template-specific night actions, backed by shared original-role and exile records.
const stoneBase={start,nightSteps,nextNight,backNight,outcomes,kill};
const STONE_REG={grave:['守墓人'],gargoyle:['石像鬼'],wolves:['狼人','狼人','狼人'],witch:['女巫'],seer:['預言家'],hunter:['獵人']};
const STONE_TITLES={grave:'守墓人',gargoyle:'石像鬼',wolves:'普通狼隊',witch:'女巫',seer:'預言家',hunter:'獵人',stoneKnife:'石像鬼 · 狼刀確認',stoneResult:'石像鬼 · 首夜查驗結果',review:'夜間結算確認'};
function ensureStone(){s.exiles??=[];s.rules.stoneFirstNight??='delayed';}
function stoneRegRoles(k){const key=k.startsWith('stoneReg-')?k.slice(9):k,rs=STONE_REG[key];return s.n===1&&rs&&rs.some(r=>s.players.filter(p=>p.role===r).length<rs.filter(x=>x===r).length)?rs:null}
function graveRecord(){ensureStone();return s.exiles.slice().reverse().find(e=>e.day===s.n-1)||null;}
function stoneCheckResult(){return player(s.draft.stoneCheck)?.role||'';}
function stoneReady(){return boardDefinition().roles.filter(r=>r!=='平民').every(r=>s.players.filter(p=>p.role===r).length===boardDefinition().roles.filter(x=>x===r).length)}
function stoneRegister(k,selected){const rs=stoneRegRoles(k),ids=selected||rs.map((_,i)=>+readHostValue('sr'+i));if(ids.some(id=>!id||!player(id)||!['未確認','平民',...rs].includes(player(id).role))||new Set(ids).size!==ids.length)return alert('請選擇不同且尚未登記的座號。');mutate(()=>{s.players.forEach(p=>{if(rs.includes(p.role)||p.role==='平民')p.role='未確認'});ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`)});if(stoneReady()){s.players.filter(p=>p.role==='未確認').forEach(p=>p.role='平民');log('所有特殊身分確認，其餘四位為平民')}if(k.startsWith('stoneReg-'))s.step++})}
nightSteps=function(){if(!isStone())return stoneBase.nightSteps();return [...(s.n===1?['stoneReg-gargoyle']:[]),'grave','wolves','stoneKnife','witch','seer','hunter','gargoyle','review']};
start=function(){if(!isStone())return stoneBase.start();mutate(()=>{ensureStone();s.players.forEach(p=>p.role='未確認');s.exiles=[];s.phase='night';log('模板：石像鬼／守墓人');s.stoneFlowVersion=3;log('首夜先確認石像鬼身分，僅認牌；正式查驗每晚放在最後。');log('規則：'+rulesText())})};
function stoneModel(){ensureStone();const k=nightSteps()[s.step],rs=stoneRegRoles(k),d=s.draft,m={kind:'night',title:STONE_TITLES[k]||STONE_TITLES[k.slice(9)],eyebrow:'NIGHT '+String(s.n).padStart(2,'0'),line:'',actions:[],detail:'',symbol:'moon',confirm:'請閉眼 · 下一位'};if(rs){m.kind='register';m.title=rs[0]==='狼人'?'普通狼人 · 認牌':rs[0]+' · 認牌';m.line=`「${rs[0]==='狼人'?'普通狼人':rs[0]}請睜眼。」`;m.confirm='確認身分';m.symbol='person';return m}
if(k==='stoneReg-gargoyle'){m.line='「石像鬼請睜眼，確認身分。」';m.detail='身分已登記，此階段不執行技能。';m.confirm='石像鬼請閉眼 · 下一位'}
if(k==='grave'){m.symbol='scroll';m.line='「守墓人請睜眼，確認放逐者的陣營。」';if(!role('守墓人').alive)m.detail='角色已出局，保留固定口令。';else{const rec=graveRecord();if(rec){m.actions=[{...action('graveResult','揭示陣營','scroll',[],false),readonly:true}];m.detail=`前一天被放逐：${who(rec.id)}。`}else m.detail='前一天無放逐結果；首夜、無人被放逐或自爆，均無查驗資料。'}}
if(k==='gargoyle'){m.symbol='eye';m.line='「石像鬼請獨立睜眼，選擇查驗對象。」';const p=role('石像鬼');if(p.alive)m.actions.push(action('stoneCheck','查驗身分','eye',alive().filter(x=>x.id!==p.id),false));else m.detail='角色已出局，保留固定口令。';}
if(k==='stoneKnife'){m.symbol='claw';m.line='「石像鬼請睜眼。請確認狼刀，並選擇目標。」';const p=role('石像鬼');if(p?.alive&&inheritsIndependentKnife())m.actions=[action('stoneKill','繼承狼刀','claw',alive().filter(x=>x.id!==p.id))];m.detail=p?.alive&&inheritsIndependentKnife()?'上帝專用：小狼已全數出局，今晚有獨立狼刀；以手勢告知。':'上帝專用：此環節沒有可用狼刀；以手勢告知，保留固定口令與停頓。';m.confirm='石像鬼請閉眼 · 下一位'}
if(k==='wolves'){m.symbol='claw';m.line='「普通狼人請睜眼，選擇今晚的擊殺目標。」';const pack=alive().filter(p=>p.role==='狼人');if(pack.length)m.actions=[action('kill','狼刀','claw')];m.detail='上帝專用：石像鬼不與小狼一同睜眼。'+(!pack.length?'小狼已全數出局；保留完整口令與停頓。':'')}
if(k==='witch'){m.symbol='bottle';m.line='「女巫請睜眼，確認是否使用藥物。」';const p=role('女巫');if(p.alive){const self=s.rules.self==='yes'||s.rules.self==='first'&&s.n===1;if(s.heal&&d.kill)m.actions.push(action('save','解藥','bottle',[player(d.kill)].filter(x=>self||x.id!==p.id)));if(s.poison)m.actions.push(action('poison','毒藥','bottle'));m.detail=s.heal?`今晚刀口：${who(d.kill)}。每晚最多一瓶藥。`:'解藥已耗盡，不再告知刀口。'}else m.detail='角色已出局，保留固定口令。'}
if(k==='seer'){m.symbol='eye';m.line='「預言家請睜眼，選擇查驗對象。」';if(role('預言家').alive)m.actions=[action('check','查驗','eye',alive().filter(p=>p.role!=='預言家'),false)];else m.detail='角色已出局，保留固定口令。'}
if(k==='hunter'){m.symbol='gun';m.line='「獵人請睜眼，確認開槍狀態。」';m.detail=!role('獵人').alive?'角色已出局，保留固定口令。':gunOK(role('獵人').id)?'可開槍':'中毒，不能開槍'}
if(k==='review'){m.kind='review';m.symbol='sun';m.title='夜晚的選擇，已經落定';m.line='夜間行動已完成。';m.confirm=s.elected?'準備迎接黎明':'進入警長競選';const c=outcomes();m.detail=Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)} · ${rs.join('、')}`).join(' ／ '):'平安夜'}return m}
nextNight=function(){if(!isStone())return stoneBase.nextNight();ensureStone();const k=nightSteps()[s.step],d=s.draft;if(stoneRegRoles(k))return stoneRegister(k);if(k==='gargoyle'&&role('石像鬼').alive&&!d.stoneCheck)return alert('石像鬼必須選擇查驗對象。');if(k==='stoneKnife'&&!inheritsIndependentKnife()&&d.stoneKill)return alert('三隻小狼尚未全數出局，石像鬼不能使用狼刀。');if((k==='gargoyle'&&d.stoneCheck===role('石像鬼').id)||(k==='stoneKnife'&&d.stoneKill===role('石像鬼').id))return alert('石像鬼不可查驗自己或自刀。');if(k==='seer'&&role('預言家').alive&&!d.check)return alert('預言家必須選擇查驗對象。');mutate(()=>{if(k==='hunter')recordHunterBriefing();if(k!=='review'){if(k==='stoneKnife'&&inheritsIndependentKnife())d.kill=d.stoneKill||0;s.step++;return}s.nightResult=outcomes();log(`夜間行動：狼刀 ${who(d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.stoneCheck)log(`石像鬼查驗 ${who(d.stoneCheck)} → ${stoneCheckResult()}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);const rec=graveRecord();if(role('守墓人').alive)log(rec?`守墓人取得 第${rec.day}天放逐 ${who(rec.id)} → ${rec.alignment}`:'守墓人：前一天無放逐結果');if(d.save)s.heal=false;if(d.poison)s.poison=false;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1})};
backNight=function(){if(!isStone())return stoneBase.backNight();if(!s.step)return;mutate(()=>{s.step--;const fields={gargoyle:['stoneCheck'],stoneKnife:['stoneKill',...(inheritsIndependentKnife()?['kill']:[])],wolves:inheritsIndependentKnife()?[]:['kill'],witch:['save','poison'],seer:['check']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]))})};
outcomes=function(){if(!isStone())return stoneBase.outcomes();const d=s.draft,c={},add=(id,why)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(why)};if(d.kill&&!d.save)add(d.kill,inheritsIndependentKnife()?'石像鬼狼刀':'狼隊刀');add(d.poison,'女巫毒');return c};
kill=function(id,reason){const p=player(id);if(p?.alive&&reason==='放逐'){ensureStone();s.exiles.push({day:s.n,id:p.id,originalRole:p.role,alignment:wolf(p)?'狼人':'好人',cause:'放逐'})}const wasAlive=p?.alive;stoneBase.kill(id,reason);if(isStone()&&wasAlive&&p.role==='狼人'&&ordinaryWolvesGone()&&role('石像鬼')?.alive)log('三隻小狼全數出局：石像鬼於下一個夜晚獨立繼承狼刀')};

if(isStone()&&s.stoneFlowVersion!==3){if(s.phase==='night'){s.step=0;s.draft={};s.flowNotice='石像鬼正式查驗已改為每晚最後，請重新確認本夜行動。';}s.stoneFlowVersion=3;save();}

// Presentation only. Read frozen snapshots; submit controller / engine commands.
const stoneBaseViews={setupUI,nightUI};
setupUI=function(){if(!isStone())return stoneBaseViews.setupUI();let html=baseViews.setupUI();const picker=`<div class="template-picker"><label>今晚的遊戲模板</label><select onchange="changeBoard(this.value)">${Object.entries(BOARD_TEMPLATES).map(([id,t])=>`<option value="${id}" ${viewState().board===id?'selected':''}>${t.label}</option>`).join('')}</select><p class="tiny">石像鬼＋3 普通狼｜預言家、女巫、獵人、守墓人｜4 平民</p></div>`;html=html.replace('<div class="setupgrid">',picker+'<div class="setupgrid">');const a=html.indexOf('<details open>'),b=html.indexOf('</details>',a)+10;return html.slice(0,a)+`<details open><summary>石像鬼／守墓人 · 本桌規則</summary><label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)">${[['no','全程不可自救'],['first','僅首夜可自救'],['yes','全程可自救']].map(([v,t])=>`<option value="${v}" ${viewState().rules.self===v?'selected':''}>${t}</option>`).join('')}</select><label class="check"><input type="checkbox" ${viewState().rules.double?'checked':''} onchange="GameEngine.setRule('double',this.checked)">雙爆吞警徽（取消則單爆）</label><p class="tiny">石像鬼與小狼互不相認，每晚查驗一位存活他人的具體身分；三隻小狼全數出局後，下一個開始的夜晚獨立繼承狼刀，可同晚查驗與刀人。石像鬼不可自爆，不可自刀。</p><p class="tiny">守墓人只取得前一天被放逐者的陣營；首夜、無人放逐、平票無放逐與自爆不產生查驗資料。夜間死亡、獵人槍擊也不算放逐。</p><p class="tiny">正式查驗順序：守墓人 → 小狼 → 女巫 → 預言家 → 獵人 → 石像鬼。狼刀確認在女巫之前：每晚固定保留石像鬼獨立確認狼刀的環節，以手勢告知是否有刀。首夜先單獨確認石像鬼身分，不查驗、不刀人，避免預言家驗到尚未認牌的石像鬼而判錯。所有環節每晚照喊，無技能或已出局時保留停頓。其他採屠邊、警長 1.5 票、女巫一晚最多一瓶藥、中毒不能開槍與原有警徽規則。</p></details>`+html.slice(b)};
nightUI=function(){if(!isStone())return stoneBaseViews.nightUI();const k=nightSteps()[viewState().step],rs=stoneRegRoles(k);if(rs){const pool=viewState().players.filter(p=>p.role==='未確認'||p.role==='平民'||rs.includes(p.role));return `<h2>${rs[0]} · 認牌</h2>${rs.map((r,i)=>`<label>${r} ${rs.length>1?i+1:''}</label><select id="sr${i}">${options(pool,0,'請選擇座號')}</select>`).join('')}<button class="primary" onclick="nextNight()">確認身分</button>`}const m=stoneModel();return `<h2>${m.title}</h2><p class="callout">${m.line}</p><div class="notice">${esc(m.detail)}</div>${m.actions.filter(a=>!a.readonly).map(a=>selectField(a.field,a.name,a.targets.map(player))).join('')}<div class="footerbar"><button onclick="backNight()" ${!viewState().step?'disabled':''}>上一步</button><button class="primary" onclick="nextNight()">確認並繼續</button></div>`};

// White Wolf King / Knight: original roles, one-use duel, cause-aware last powers.
const whiteBase={start,nightSteps,nextNight,backNight,outcomes,kill,newNight,settle,boom,badge,candidate};
const WHITE_REG={guard:['守衛'],wolves:['白狼王','狼人','狼人','狼人'],witch:['女巫'],seer:['預言家'],knight:['騎士']};
const WHITE_TITLE={guard:'守衛',wolves:'白狼王與狼隊',witch:'女巫',seer:'預言家',knight:'騎士 · 首夜認牌',review:'夜間結算'};
function ensureWhite(){s.white??={duelUsed:false,voting:false,action:null};s.rules.guardSaveDies??=true;}
function whiteRegRoles(k){const rs=WHITE_REG[k];return s.n===1&&rs&&rs.some(r=>s.players.filter(p=>p.role===r).length<rs.filter(x=>x===r).length)?rs:null;}
function whiteReady(){return boardDefinition().roles.filter(r=>r!=='平民').every(r=>s.players.filter(p=>p.role===r).length===boardDefinition().roles.filter(x=>x===r).length);}
function whiteRegister(k,selected){const rs=whiteRegRoles(k),ids=selected||rs.map((_,i)=>+readHostValue('wr'+i));if(ids.some(id=>!player(id)||!['未確認','平民',...rs].includes(player(id).role))||new Set(ids).size!==ids.length)return alert('請選擇不同且尚未登記的座號。');mutate(()=>{s.players.forEach(p=>{if(rs.includes(p.role)||p.role==='平民')p.role='未確認'});ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`)});if(whiteReady())s.players.filter(p=>p.role==='未確認').forEach(p=>p.role='平民');if(k==='knight')s.step++});}
nightSteps=function(){return isWhiteKnight()?['guard','wolves','witch','seer',...(s.n===1?['knight']:[]),'review']:whiteBase.nightSteps();};
start=function(){if(!isWhiteKnight())return whiteBase.start();mutate(()=>{ensureWhite();s.players.forEach(p=>p.role='未確認');s.white={duelUsed:false,voting:false,action:null};s.phase='night';log('模板：白狼王／騎士；首夜逐一認牌');log('規則：'+rulesText())});};
function whiteNightModel(){ensureWhite();const k=nightSteps()[s.step],rs=whiteRegRoles(k),d=s.draft,m={kind:'night',title:WHITE_TITLE[k],eyebrow:'NIGHT '+String(s.n).padStart(2,'0'),line:'',actions:[],detail:'',symbol:'moon',confirm:'請閉眼 · 下一位'};if(rs){m.kind='register';m.title=WHITE_TITLE[k]+' · 認牌';m.line=k==='wolves'?'「白狼王、狼人請一起睜眼。」':`「${rs[0]}請睜眼。」`;m.symbol='person';m.confirm='確認身分';return m}if(k==='guard'){m.symbol='shield';m.line='「守衛請睜眼，選擇今晚的守護對象。」';if(role('守衛')?.alive)m.actions=[action('guard','守護','shield',alive().filter(p=>p.id!==s.guardLast))];m.detail=`上一晚守護：${who(s.guardLast)}。可自守，不可連守。`;}if(k==='wolves'){m.symbol='claw';m.line='「白狼王、狼人請一起睜眼，選擇今晚的擊殺目標。」';if(alive().some(wolf))m.actions=[action('kill','狼刀','claw')];}if(k==='witch'){m.symbol='bottle';m.line='「女巫請睜眼，確認是否使用藥物。」';const p=role('女巫');if(p?.alive){const self=s.rules.self==='yes'||s.rules.self==='first'&&s.n===1;if(s.heal&&d.kill&&(self||d.kill!==p.id))m.actions.push(action('save','解藥','bottle',[player(d.kill)]));if(s.poison)m.actions.push(action('poison','毒藥','bottle'));m.detail=s.heal?`今晚刀口：${who(d.kill)}。每晚最多一瓶藥。`:'解藥已耗盡，不再告知刀口。';}}if(k==='seer'){m.symbol='eye';m.line='「預言家請睜眼，選擇查驗對象。」';if(role('預言家')?.alive)m.actions=[action('check','查驗陣營','eye',alive().filter(p=>p.role!=='預言家'),false)];}if(k==='review'){m.kind='review';m.symbol='sun';m.title='夜晚的選擇，已經落定';m.line='夜間行動已完成。';m.confirm=s.elected?'準備迎接黎明':'進入警長競選';const c=outcomes();m.detail=Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)} · ${rs.join('、')}`).join(' ／ '):'平安夜';}return m;}
nextNight=function(){if(!isWhiteKnight())return whiteBase.nextNight();const k=nightSteps()[s.step],d=s.draft;ensureWhite();if(whiteRegRoles(k))return whiteRegister(k);if(k==='guard'&&d.guard&&d.guard===s.guardLast)return alert('守衛不可連續守護同一位玩家。');if(k==='witch'&&d.save&&d.poison)return alert('女巫每晚最多一瓶藥。');if(k==='seer'&&role('預言家')?.alive&&!d.check)return alert('請先選擇查驗對象。');mutate(()=>{if(k!=='review'){s.step++;return}s.nightResult=outcomes();log(`守衛守護 ${who(d.guard)}；狼刀 ${who(d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);s.guardLast=d.guard||0;if(d.save)s.heal=false;if(d.poison)s.poison=false;s.white.voting=false;s.white.action=null;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1;});};
backNight=function(){if(!isWhiteKnight())return whiteBase.backNight();if(!s.step)return;mutate(()=>{s.step--;const fields={guard:['guard'],wolves:['kill'],witch:['save','poison'],seer:['check']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]));});};
outcomes=function(){if(!isWhiteKnight())return whiteBase.outcomes();ensureWhite();const d=s.draft,c={},add=(id,why)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(why)},guarded=d.guard&&d.guard===d.kill;if(d.kill&&(!guarded&&!d.save||guarded&&d.save&&s.rules.guardSaveDies))add(d.kill,guarded&&d.save?'同守同救':'狼隊刀');add(d.poison,'女巫毒');return c;};
kill=function(id,reason){const p=player(id),was=p?.alive;whiteBase.kill(id,reason);if(isWhiteKnight()&&was&&p.role==='白狼王'&&['自爆','放逐','槍擊'].includes(reason)){s.pending.push({id:p.id,guns:1,type:'whiteTake'});log('白狼王帶人待處理：'+reason);}};
newNight=function(){if(isWhiteKnight()){ensureWhite();s.white.voting=false;s.white.action=null;}whiteBase.newNight();};
settle=function(){if(isWhiteKnight()){ensureWhite();s.white.voting=false;s.white.action=null;}whiteBase.settle();};
function whiteCanAct(){ensureWhite();return isWhiteKnight()&&['day','election'].includes(s.phase)&&!s.voteDone&&!s.white.voting&&!Object.keys(s.votes).length&&!s.pending.length&&!s.badge&&!s.white.action;}
function beginWhiteVote(){if(!whiteCanAct())return;mutate(()=>{s.white.voting=true;log(s.phase==='election'?'開始警長投票；白天技能關閉':'開始放逐投票；白天技能關閉');});}
function openWhiteAction(kind){if(!whiteCanAct())return toast('投票開始後不能發動白天技能。');const p=kind==='duel'?role('騎士'):kind==='explode'?role('白狼王'):null;if(kind==='duel'&&(!p?.alive||s.white.duelUsed)||kind==='explode'&&!p?.alive)return;mutate(()=>{s.white.action={kind,actor:p?.id||0,target:0};});}
function cancelWhiteAction(){if(!isWhiteKnight()||!s.white.action)return;mutate(()=>s.white.action=null);}
function whiteActionModel(){ensureWhite();const h=s.pending[0];if(h?.type==='whiteTake')return {kind:'whiteTake',title:'白狼王 · 最後的獠牙',eyebrow:'LAST POWER',line:`${who(h.id)}，選擇一位存活玩家帶走。`,symbol:'claw',actions:[action('whiteTarget','帶走','claw')],confirm:'確認帶走'};const a=s.white.action;if(!a)return null;const duel=a.kind==='duel',pack=a.kind==='ordinary';return {kind:'whiteAction',title:duel?'騎士 · 決鬥':pack?'狼人 · 自爆':'白狼王 · 自爆',eyebrow:'BEFORE THE VOTE',line:duel?`${who(a.actor)}，選擇你的決鬥對象。`:pack?'選擇要自爆的普通狼人。':`${who(a.actor)} 自爆後，將處理帶人並結束白天。`,symbol:duel?'shield':'claw',actions:duel?[action('whiteTarget','決鬥','shield',alive().filter(p=>p.id!==a.actor),false)]:pack?[action('whiteTarget','自爆者','claw',alive().filter(p=>p.role==='狼人'),false)]:[],confirm:duel?'確認決鬥':pack?'確認狼人自爆':'確認白狼王自爆'};}
function whiteFinishTransition(){checkWin();if(s.afterBoom&&!s.pending.length&&!s.badge&&!s.winner){s.afterBoom=false;newNight();}}
function whiteCloseDay(explosion){if(s.phase==='election'){if(explosion)consumeElectionExplosion();s.phase='dawn';Object.entries(s.nightResult||{}).forEach(([id,c])=>kill(+id,c.join('＋')));s.nightResult=null;s.phase='day';}s.afterBoom=true;}
function resolveWhiteAction(){ensureWhite();const a=s.white.action;if(!a)return;const t=a.target,p=player(t);if(a.kind==='duel'&&(!p?.alive||t===a.actor)||a.kind==='ordinary'&&(!p?.alive||p.role!=='狼人'))return toast('請選擇有效的存活目標。');if(!['day','election'].includes(s.phase)||s.pending.length||s.badge||s.white.voting||s.voteDone||Object.keys(s.votes).length)return toast('目前不能發動白天技能。');if(a.kind==='duel'&&(!player(a.actor)?.alive||s.white.duelUsed)||a.kind==='explode'&&!player(a.actor)?.alive)return toast('角色已出局或技能已使用。');mutate(()=>{s.white.action=null;if(a.kind==='duel'){s.white.duelUsed=true;log(`騎士 ${who(a.actor)} 決鬥 ${who(t)} → ${p.role}`);if(wolf(p)){kill(t,'騎士決鬥');whiteCloseDay(false);}else{kill(a.actor,'決鬥失敗');s.candidates=s.candidates.filter(id=>player(id)?.alive);s.votes={};s.pk=[];s.voteRound=1;log('決鬥對象為好人：騎士出局，白天繼續');}}else{kill(a.kind==='ordinary'?t:a.actor,'自爆');whiteCloseDay(true);}whiteFinishTransition();});}
function resolveWhiteTake(id=0){const h=s.pending[0];if(h?.type!=='whiteTake'||id&&!player(id)?.alive)return;mutate(()=>{s.pending.shift();log(`${who(h.id)} ${id?'帶走 → '+who(id):'放棄帶人'}`);if(id)kill(id,'白狼王帶走');whiteFinishTransition();});}
boom=function(){if(!isWhiteKnight())return whiteBase.boom();if(!whiteCanAct())return toast('投票開始後不能自爆。');openWhiteAction(role('白狼王')?.alive?'explode':'ordinary');};
candidate=function(id,on){if(isWhiteKnight()&&(s.white?.voting||s.white?.action))return;whiteBase.candidate(id,on);};
badge=function(){if(!isWhiteKnight())return whiteBase.badge();const id=+readHostValue('badge');if(id&&!player(id)?.alive)return;mutate(()=>{s.sheriff=id;s.badge=false;log(id?`警徽移交 ${who(id)}`:'警徽撕毀');whiteFinishTransition();});};

// Presentation only. Read frozen snapshots; submit controller / engine commands.
const whiteBaseViews={setupUI,nightUI,dayUI,electionUI,pendingUI};
setupUI=function(){if(!isWhiteKnight())return whiteBaseViews.setupUI();const html=baseViews.setupUI().replace('<div class="setupgrid">',`<div class="template-picker"><label>今晚的遊戲模板</label><select onchange="changeBoard(this.value)">${Object.entries(BOARD_TEMPLATES).map(([id,t])=>`<option value="${id}" ${viewState().board===id?'selected':''}>${t.label}</option>`).join('')}</select></div><div class="setupgrid">`),a=html.indexOf('<details open>'),b=html.indexOf('</details>',a)+10;return html.slice(0,a)+`<details open><summary>白狼王／騎士 · 本桌規則</summary><p>白狼王＋3 普通狼｜預言家、女巫、守衛、騎士｜4 平民</p><label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)">${[['no','全程不可自救'],['first','僅首夜可自救'],['yes','全程可自救']].map(([v,t])=>`<option value="${v}" ${viewState().rules.self===v?'selected':''}>${t}</option>`).join('')}</select><label class="check"><input type="checkbox" ${viewState().rules.double?'checked':''} onchange="GameEngine.setRule('double',this.checked)">雙爆吞警徽</label><label class="check"><input type="checkbox" ${viewState().rules.guardSaveDies?'checked':''} onchange="GameEngine.setRule('guardSaveDies',this.checked)">同守同救仍死亡</label><p class="tiny">白狼王與小狼共同睜眼。白狼王於投票前自爆、被放逐、被獵人槍殺，可帶走一位存活玩家；女巫毒、騎士決鬥、普通狼刀不觸發帶人。騎士整場一次、投票前可決鬥：狼目標出局並直接入夜；好人目標使騎士出局，白天繼續。每晚守衛 → 狼隊 → 女巫 → 預言家；首夜另確認騎士身分。守衛可自守、不可連守；女巫每晚最多一瓶藥；屠邊、警長 1.5 票；出局技能全部處理後判勝。</p></details>`+html.slice(b);};
nightUI=function(){if(!isWhiteKnight())return whiteBaseViews.nightUI();const k=nightSteps()[viewState().step],rs=whiteRegRoles(k);if(rs)return `<h2>${WHITE_TITLE[k]} · 認牌</h2>${rs.map((r,i)=>`<label>${r}</label><select id="wr${i}">${options(viewState().players.filter(p=>['未確認','平民',...rs].includes(p.role)),0,'請選擇座號')}</select>`).join('')}<button class="primary" onclick="nextNight()">確認身分</button>`;const m=whiteNightModel();return `<h2>${m.title}</h2><p class="callout">${m.line}</p><div class="notice">${esc(m.detail)}</div>${m.actions.map(a=>selectField(a.field,a.name,a.targets.map(player))).join('')}<button class="primary" onclick="nextNight()">確認並繼續</button>`;};
function whitePowerButtons(){if(!whiteCanAct())return '';return `${role('騎士')?.alive&&!viewState().white.duelUsed?`<button class="day-power" onclick="openWhiteAction('duel')">${portrait('騎士')}<span><strong>騎士決鬥</strong><small>整場一次</small></span>${icon('shield')}</button>`:''}${role('白狼王')?.alive?`<button class="day-power danger" onclick="openWhiteAction('explode')">${portrait('白狼王')}<span><strong>白狼王自爆</strong><small>帶人後入夜</small></span>${icon('claw')}</button>`:''}${alive().some(p=>p.role==='狼人')?`<button class="day-power" onclick="openWhiteAction('ordinary')">${portrait('狼人')}<span><strong>狼人自爆</strong><small>結束白天</small></span>${icon('flame')}</button>`:''}`;}

pendingUI=function(){if(!isWhiteKnight()||viewState().pending[0]?.type!=='whiteTake')return whiteBaseViews.pendingUI();return `<h2>白狼王帶人</h2><select id="whiteTakeTarget">${options(alive(),0,'放棄帶人')}</select><button class="primary" onclick="resolveWhiteTake(+document.getElementById('whiteTakeTarget').value)">確認帶人／放棄</button>`;};
dayUI=function(){if(!isWhiteKnight())return whiteBaseViews.dayUI();return viewState().white.action?'<h2>白天技能處理中</h2><p>點選村莊中的目標，再確認技能。</p>':`<h2>白天議事</h2>${viewState().voteDone?'<p>今日放逐已完成。</p><button onclick="endDay()">入夜</button>':viewState().white.voting?voteUI():`<div class="row">${whitePowerButtons()}</div><button class="primary" onclick="beginWhiteVote()">開始放逐投票</button>`}`;};
electionUI=function(){if(!isWhiteKnight())return whiteBaseViews.electionUI();if(viewState().white.action)return '<h2>白天技能處理中</h2><p>在村莊中確認或取消技能。</p>';return `<h2>警長競選</h2>${viewState().white.voting?voteUI(true):`<div class="votes">${alive().map(p=>`<label class="check"><input type="checkbox" ${viewState().candidates.includes(p.id)?'checked':''} onchange="candidate(${p.id},this.checked)">${who(p.id)}</label>`).join('')}</div><div class="row">${whitePowerButtons()}</div><button onclick="beginWhiteVote()" ${!viewState().candidates.length?'disabled':''}>開始警長投票</button><button onclick="noSheriff()">無警長</button>`}`;};

// Blood Moon Messenger / Demon Hunter. Timing lives in persisted board state;

const bloodBase={start,nightSteps,nextNight,backNight,outcomes,kill,newNight,settle,boom,badge,candidate,winner,checkWin};
const BLOOD_REG={guard:['守衛'],wolves:['血月使者','狼人','狼人','狼人'],witch:['女巫'],seer:['預言家'],demon:['獵魔人']};
const BLOOD_TITLES={guard:'守衛',wolves:'血月使者與狼隊',witch:'女巫',seer:'預言家',demon:'獵魔人',review:'夜間結算'};
function ensureBlood(){s.blood??={sealedNight:0,lastNight:0,lastWolf:0,finalResolution:false,finalResolved:false,forcedWinner:'',voting:false,action:null};s.rules.guardSaveDies??=true;}
function bloodSealed(){ensureBlood();return s.blood.sealedNight===s.n;}
function bloodFinalNight(){ensureBlood();return s.blood.lastNight===s.n&&!s.blood.finalResolved;}
function bloodRegRoles(k){const rs=BLOOD_REG[k];return s.n===1&&rs&&rs.some(r=>s.players.filter(p=>p.role===r).length<rs.filter(x=>x===r).length)?rs:null;}
function bloodReady(){return boardDefinition().roles.filter(r=>r!=='平民').every(r=>s.players.filter(p=>p.role===r).length===boardDefinition().roles.filter(x=>x===r).length);}
function bloodRegister(k,selected){const rs=bloodRegRoles(k),ids=selected||rs.map((_,i)=>+readHostValue('br'+i));if(ids.some(id=>!player(id)||!['未確認','平民',...rs].includes(player(id).role))||new Set(ids).size!==ids.length)return alert('請選擇不同且尚未登記的座號。');mutate(()=>{s.players.forEach(p=>{if(rs.includes(p.role)||p.role==='平民')p.role='未確認'});ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`)});if(bloodReady()){s.players.filter(p=>p.role==='未確認').forEach(p=>p.role='平民');log('所有特殊身分確認，其餘四位為平民');}});}
nightSteps=function(){return isBloodMoon()?['guard','wolves','witch','seer','demon','review']:bloodBase.nightSteps();};
start=function(){if(!isBloodMoon())return bloodBase.start();mutate(()=>{ensureBlood();s.players.forEach(p=>p.role='未確認');s.blood={sealedNight:0,lastNight:0,lastWolf:0,finalResolution:false,finalResolved:false,forcedWinner:'',voting:false,action:null};s.phase='night';log('模板：血月使者／獵魔人；首夜逐一認牌');log('規則：'+rulesText());});};
function bloodNightModel(){ensureBlood();const k=nightSteps()[s.step],rs=bloodRegRoles(k),d=s.draft,sealed=bloodSealed(),final=bloodFinalNight(),m={kind:'night',title:BLOOD_TITLES[k],eyebrow:'NIGHT '+String(s.n).padStart(2,'0'),line:'',actions:[],detail:'',symbol:'moon',confirm:'請閉眼 · 下一位'};if(rs){m.kind='register';m.title=BLOOD_TITLES[k]+' · 認牌';m.line=k==='wolves'?'「血月使者、狼人請一起睜眼。」':`「${rs[0]}請睜眼。」`;m.symbol='person';m.confirm='確認身分';return m;}
if(k==='guard'){m.symbol='shield';m.line='「守衛請睜眼，選擇今晚的守護對象。」';if(!sealed&&role('守衛')?.alive)m.actions=[action('guard','守護','shield',alive().filter(p=>p.id!==s.guardLast))];m.detail=`上一晚守護：${who(s.guardLast)}。可自守，不可連守。`;}
if(k==='wolves'){m.symbol='claw';m.line='「參與今晚狼刀的狼人請睜眼。請選擇今晚的擊殺目標。」';if(alive().some(wolf))m.actions=[action('kill',final?'最後黑夜 · 狼刀':'狼刀','claw',alive().filter(p=>!final||p.id!==s.blood.lastWolf),!final)];if(final)m.detail='上帝專用：最後黑夜僅一刀；守護、解藥照常有效。夜間結算後判定屠邊，否則血月使者出局。';}
if(k==='witch'){m.symbol='bottle';m.line='「女巫請睜眼，確認是否使用藥物。」';const p=role('女巫');if(!sealed&&p?.alive){const self=s.rules.self==='yes'||s.rules.self==='first'&&s.n===1;if(s.heal&&d.kill&&(self||d.kill!==p.id))m.actions.push(action('save','解藥','bottle',[player(d.kill)]));if(s.poison)m.actions.push(action('poison','毒藥','bottle'));m.detail=s.heal?`今晚刀口：${who(d.kill)}。每晚最多一瓶藥。`:'解藥已耗盡，不再告知刀口。';}}
if(k==='seer'){m.symbol='eye';m.line='「預言家請睜眼，選擇查驗對象。」';if(!sealed&&role('預言家')?.alive)m.actions=[action('check','查驗陣營','eye',alive().filter(p=>p.role!=='預言家'),false)];}

if(sealed&&['guard','witch','seer','demon'].includes(k))m.detail='上帝專用：本夜好人技能封印，不發動、不消耗；仍照固定口令與相同停頓，勿朗讀此段。';else if(['guard','witch','seer','demon'].includes(k)&&!role(BLOOD_REG[k][0])?.alive)m.detail='上帝專用：角色已出局；保留固定口令與相同停頓。';
if(k==='review'){m.kind='review';m.symbol='sun';m.title=final?'最後黑夜，命運即將落定':'夜晚的選擇，已經落定';m.line='夜間行動已完成。';m.confirm=s.elected?'準備迎接黎明':'進入警長競選';const c=outcomes();m.detail=(sealed?'上帝專用：本夜好人技能封印。':'')+(Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)} · ${rs.join('、')}`).join(' ／ '):'平安夜')+(d.poison&&player(d.poison)?.role==='獵魔人'?' ／ 獵魔人免疫女巫毒；毒藥仍已使用。':'')+(final?' ／ 夜間結算後判定最後黑夜勝負。':'');}return m;}
function bloodValidateDraft(){const d=s.draft;if(bloodSealed()){if(['guard','save','poison','check','hunt'].some(f=>d[f]))return '本夜好人技能封印，不能登記技能。';}else{if(d.guard&&(!role('守衛')?.alive||d.guard===s.guardLast||!player(d.guard)?.alive))return '守護目標無效，或與前一晚重複。';if(d.save&&d.poison)return '女巫每晚最多一瓶藥。';if(d.save&&(!role('女巫')?.alive||!s.heal||!d.kill))return '目前無法使用解藥。';if(d.save&&d.kill===role('女巫')?.id&&!(s.rules.self==='yes'||s.rules.self==='first'&&s.n===1))return '本桌規則不允許女巫此夜自救。';if(d.poison&&(!role('女巫')?.alive||!s.poison||!player(d.poison)?.alive))return '目前無法使用毒藥。';if(d.check&&(!role('預言家')?.alive||!player(d.check)?.alive||d.check===role('預言家')?.id))return '查驗目標無效。';if(d.hunt&&(s.n<2||!role('獵魔人')?.alive||!player(d.hunt)?.alive||d.hunt===role('獵魔人')?.id))return '首夜不能狩獵，且只能狩獵存活的其他玩家。';}if(d.kill&&(!player(d.kill)?.alive||!alive().some(wolf)||bloodFinalNight()&&d.kill===s.blood.lastWolf))return '狼刀目標無效。';return '';}
nextNight=function(){if(!isBloodMoon())return bloodBase.nextNight();ensureBlood();const k=nightSteps()[s.step],d=s.draft;if(bloodRegRoles(k))return bloodRegister(k);const error=bloodValidateDraft();if(error)return alert(error);if(k==='seer'&&!bloodSealed()&&role('預言家')?.alive&&!d.check)return alert('請先選擇查驗對象。');if((k==='wolves'||k==='review')&&bloodFinalNight()&&role('血月使者')?.alive&&!d.kill)return alert('最後黑夜必須指定一位存活的其他玩家。');mutate(()=>{if(k!=='review'){s.step++;return}s.nightResult=outcomes();log(`夜間行動：${bloodSealed()?'好人技能封印；':''}守護 ${who(d.guard)}；狼刀 ${who(d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);if(d.hunt)log(`獵魔人狩獵 ${who(d.hunt)} → ${wolf(player(d.hunt))?'目標出局':'獵魔人反噬出局'}`);if(d.poison&&player(d.poison)?.role==='獵魔人')log('獵魔人免疫女巫毒藥；毒藥已消耗');s.guardLast=d.guard||0;if(d.save)s.heal=false;if(d.poison)s.poison=false;s.blood.voting=false;s.blood.action=null;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1;});};
backNight=function(){if(!isBloodMoon())return bloodBase.backNight();if(!s.step)return;mutate(()=>{s.step--;const fields={guard:['guard'],wolves:['kill'],witch:['save','poison'],seer:['check'],demon:['hunt']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]));});};
outcomes=function(){if(!isBloodMoon())return bloodBase.outcomes();ensureBlood();const d=s.draft,sealed=bloodSealed(),c={},add=(id,why)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(why)},guarded=!sealed&&d.guard&&d.guard===d.kill,saved=!sealed&&d.save;if(d.kill&&(!guarded&&!saved||guarded&&saved&&s.rules.guardSaveDies))add(d.kill,guarded&&saved?'同守同救':'狼隊刀');if(!sealed){if(player(d.poison)?.role!=='獵魔人')add(d.poison,'女巫毒');if(s.n>=2&&role('獵魔人')?.alive&&d.hunt&&d.hunt!==role('獵魔人').id){if(wolf(player(d.hunt)))add(d.hunt,'獵魔狩獵');else add(role('獵魔人').id,'獵魔反噬');}}return c;};
kill=function(id,reason){if(!isBloodMoon())return bloodBase.kill(id,reason);ensureBlood();const p=player(id);if(!p?.alive)return;if(p.role==='獵魔人'&&reason==='女巫毒'){log(`${who(id)} 免疫女巫毒藥`);return;}if(p.role==='血月使者'&&reason==='放逐'&&!alive().some(x=>wolf(x)&&x.id!==p.id)&&!s.blood.lastNight){s.exiles??=[];s.exiles.push({day:s.n,id:p.id,originalRole:p.role,alignment:'狼人',cause:'放逐'});s.blood.lastNight=s.n+1;s.blood.lastWolf=p.id;s.blood.finalResolved=false;log(`${who(id)} 被放逐：血月使者為最後一狼，延後死亡，進入第 ${s.blood.lastNight} 夜最後黑夜`);return;}bloodBase.kill(id,reason);};
function bloodEdge(){return !alive().some(p=>p.role==='平民')||!alive().some(p=>!wolf(p)&&p.role!=='平民');}
function finishBloodFinalNight(){if(!s.blood.finalResolution)return;s.blood.finalResolution=false;s.blood.finalResolved=true;const p=player(s.blood.lastWolf);if(p?.alive&&bloodEdge()){s.blood.forcedWinner='狼人陣營獲勝';log('最後黑夜結算：血月使者仍存活且達成屠邊');}else{if(p?.alive)kill(p.id,'最後黑夜結束');log('最後黑夜結算：未取得狼人勝利，血月使者出局');}}
winner=function(){if(isBloodMoon()){ensureBlood();if(!s.pending.length&&s.blood.forcedWinner)return s.blood.forcedWinner;}return bloodBase.winner();};

if(k==='fear'){m.line='「夢魘請單獨睜眼，確認今晚是否恐懼。」';m.symbol='moon';if(role('夢魘')?.alive)m.actions=[action('fear','恐懼','moon',alive().filter(p=>p.role!=='夢魘'&&p.id!==s.dream.lastFear))];m.detail=`上一晚恐懼：${who(s.dream.lastFear)}。不可連恐，可不使用。`;}

if(k==='wolves'){m.line='「參與今晚狼刀的狼人請睜眼。請選擇今晚的擊殺目標。」';m.symbol='claw';if(alive().some(wolf)&&!dreamKnifeBlocked())m.actions=[action('kill','狼刀','claw')];m.detail=dreamKnifeBlocked()?'上帝專用：普通狼人被恐懼，全狼隊本夜無刀；以手勢告知，保留固定口令。':'上帝專用：夢魘與普通狼人共同睜眼刀人。';}

function dreamDraftError(){const d=s.draft;if(d.fear&&(!role('夢魘')?.alive||!player(d.fear)?.alive||d.fear===role('夢魘')?.id||d.fear===s.dream.lastFear))return '不可恐懼自己、出局者或連續恐懼同一人。';if(d.dream&&(!role('攝夢人')?.alive||dreamFeared(role('攝夢人').id)||!player(d.dream)?.alive||d.dream===role('攝夢人').id))return '目前不能攝夢，或目標無效。';if(d.kill&&(dreamKnifeBlocked()||!alive().some(wolf)||!player(d.kill)?.alive))return '本夜無狼刀，或目標無效。';if((d.save||d.poison)&&(!role('女巫')?.alive||dreamFeared(role('女巫').id)))return '女巫已出局或被恐懼，不能使用藥物。';if(d.save&&d.poison)return '女巫每晚最多一瓶藥。';if(d.save&&(!s.heal||!d.kill||dreamKnifeBlocked()))return '目前沒有可用解藥或刀口。';if(d.save&&d.kill===role('女巫')?.id&&!(s.rules.self==='yes'||s.rules.self==='first'&&s.n===1))return '本桌規則不允許此夜自救。';if(d.poison&&(!s.poison||!player(d.poison)?.alive))return '毒藥已使用或目標無效。';if(d.check&&(!role('預言家')?.alive||dreamFeared(role('預言家').id)||!player(d.check)?.alive||d.check===role('預言家').id))return '目前不能查驗，或目標無效。';return '';}
nextNight=function(){if(!isDream())return dreamBase.nextNight();ensureDream();const k=nightSteps()[s.step],d=s.draft;if(dreamRegRoles(k))return dreamRegister(k);const error=dreamDraftError();if(error)return alert(error);if(k==='seer'&&role('預言家')?.alive&&!dreamFeared(role('預言家').id)&&!d.check)return alert('請先選擇查驗對象。');mutate(()=>{if(k==='hunter')recordHunterBriefing();if(k!=='review'){s.step++;return}s.nightResult=outcomes();log(`夜間行動：夢魘恐懼 ${who(d.fear)}；攝夢 ${who(effectiveDream())}；狼刀 ${who(dreamKnifeBlocked()?0:d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);s.dream.priorTarget=s.dream.lastTarget;s.dream.resolvedNight=s.n;s.dream.lastFear=d.fear||0;s.dream.linkTarget=effectiveDream();s.dream.linkNight=s.n;s.dream.lastTarget=effectiveDream();s.dream.nightResolving=false;s.dream.voting=false;s.dream.action=null;if(d.save)s.heal=false;if(d.poison)s.poison=false;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1;});};
backNight=function(){if(!isDream())return dreamBase.backNight();if(!s.step)return;mutate(()=>{s.step--;const fields={fear:['fear'],dream:['dream'],wolves:['kill'],witch:['save','poison'],seer:['check']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]));});};
outcomes=function(){if(!isDream())return dreamBase.outcomes();ensureDream();const d=s.draft,c={},t=effectiveDream(),add=(id,why)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(why)};if(!dreamKnifeBlocked()&&d.kill&&!d.save&&d.kill!==t)add(d.kill,'狼隊刀');if(!dreamFeared(role('女巫')?.id)&&d.poison&&d.poison!==t)add(d.poison,'女巫毒');if(t&&t===(s.dream.resolvedNight===s.n?s.dream.priorTarget:s.dream.lastTarget))add(t,'連續攝夢');if(t&&c[role('攝夢人')?.id])add(t,'攝夢牽連');return c;};
function dreamNightDeath(reason){return s.phase==='night'||s.phase==='dawn'||s.dream.nightResolving&&reason!=='放逐'&&reason!=='自爆';}
kill=function(id,reason){if(!isDream())return dreamBase.kill(id,reason);ensureDream();const p=player(id);if(!p?.alive)return;const night=dreamNightDeath(reason),before=s.pending.length;if(night)s.dream.nightResolving=true;dreamBase.kill(id,reason);if(night&&p.role==='獵人'&&dreamFeared(p.id)){s.pending.splice(before);log(`${who(id)} 當夜被恐懼，不能開夜槍`);}if(night&&p.role==='攝夢人'&&s.dream.linkNight===s.n&&s.dream.linkTarget){const t=s.dream.linkTarget;if(player(t)?.alive)kill(t,(s.nightResult?.[t]||['攝夢牽連']).join('＋'));}};
gunOK=function(id){if(isDream()&&dreamFeared(id))return false;return dreamBase.gunOK(id);};
checkWin=function(){dreamBase.checkWin();if(isDream()&&!s.pending.length){ensureDream();s.dream.nightResolving=false;}};
settle=function(){if(!isDream())return dreamBase.settle();mutate(()=>{ensureDream();s.dream.nightResolving=true;log(Object.keys(s.nightResult||{}).length?'公布夜間死訊':'公布：平安夜');Object.entries(s.nightResult||{}).forEach(([id,c])=>kill(+id,c.join('＋')));s.nightResult=null;s.phase='day';s.voteDone=false;s.votes={};s.pk=[];s.voteRound=1;s.dream.voting=false;s.dream.action=null;checkWin();});};
newNight=function(){if(isDream()){ensureDream();s.dream.linkTarget=0;s.dream.linkNight=0;s.dream.nightResolving=false;s.dream.voting=false;s.dream.action=null;}dreamBase.newNight();};
function dreamCanAct(){ensureDream();return isDream()&&['day','election'].includes(s.phase)&&!s.voteDone&&!s.dream.voting&&!Object.keys(s.votes).length&&!s.pending.length&&!s.badge&&!s.dream.action;}
function beginDreamVote(){if(!dreamCanAct())return;mutate(()=>{s.dream.voting=true;log(s.phase==='election'?'開始警長投票；自爆關閉':'開始放逐投票；自爆關閉');});}
function openDreamAction(){if(!dreamCanAct())return toast('投票開始後不能自爆。');mutate(()=>s.dream.action={kind:'explode',target:0});}

function dreamActionModel(){return {kind:'dreamAction',title:'狼人 · 自爆',eyebrow:'BEFORE THE VOTE',line:'選擇要自爆的狼人。',symbol:'claw',actions:[action('dreamTarget','自爆者','claw',alive().filter(wolf),false)],confirm:'確認狼人自爆'};}

function resolveDreamAction(){const a=s.dream.action,p=player(a?.target);if(!a||!p?.alive||!wolf(p))return toast('請選擇存活狼人。');if(!['day','election'].includes(s.phase)||s.voteDone||s.dream.voting||Object.keys(s.votes).length||s.pending.length||s.badge)return toast('目前不能自爆。');mutate(()=>{s.dream.action=null;const election=s.phase==='election';kill(p.id,'自爆');if(election){consumeElectionExplosion();s.phase='dawn';s.dream.nightResolving=true;Object.entries(s.nightResult||{}).forEach(([id,c])=>kill(+id,c.join('＋')));s.nightResult=null;s.phase='day';}s.afterBoom=true;dreamFinishTransition();});}

candidate=function(id,on){if(isDream()&&(s.dream?.voting||s.dream?.action))return;dreamBase.candidate(id,on);};
badge=function(){if(!isDream())return dreamBase.badge();const id=+readHostValue('badge');if(id&&!player(id)?.alive)return;mutate(()=>{s.sheriff=id;s.badge=false;log(id?`警徽移交 ${who(id)}`:'警徽撕毀');dreamFinishTransition();});};

const cupidBase={start,nightSteps,nextNight,backNight,outcomes,kill,settle,newNight,winner,boom,candidate,badge,roleStatus,countVotes,gunOK};
const CUPID_DECK=['預言家','女巫','獵人','白痴','平民','平民','平民','平民','平民','狼王','狼人','狼人','盜賊','丘比特'];
const CUPID_CARD_ROLES=[...new Set(CUPID_DECK)].filter(r=>!['盜賊','丘比特'].includes(r));
const CUPID_TITLES={reserve:'盜賊的兩張備選牌',thief:'盜賊',cupid:'丘比特',lovers:'戀人互認',wolves:'狼隊',witch:'女巫',seer:'預言家',hunter:'獵人',idiot:'白痴 · 首夜認牌',review:'夜間結算'};
function ensureCupid(){s.cupid??={reserve:['',''],pick:-1,thiefId:0,cupidId:0,lovers:[],third:null,speakers:[],voting:false,action:null,deathBatch:null};}
function cupidExpected(){ensureCupid();if(s.cupid.pick<0)return [];const rs=CUPID_DECK.slice();rs.splice(rs.indexOf('盜賊'),1);rs.splice(rs.indexOf(s.cupid.reserve[1-s.cupid.pick]),1);return rs;}
function cupidRegRoles(k){if(s.n!==1)return null;ensureCupid();if(k==='thief')return !s.cupid.thiefId?['盜賊']:null;if(k==='cupid')return !s.cupid.cupidId?['丘比特']:null;const family={wolves:['狼王','狼人'],witch:['女巫'],seer:['預言家'],hunter:['獵人'],idiot:['白痴']}[k];if(!family)return null;const out=[];for(const r of family){let missing=cupidExpected().filter(x=>x===r).length-s.players.filter(p=>p.role===r).length;while(missing-->0)out.push(r);}return out.length?out:null;}
function cupidReady(){const rs=cupidExpected();return rs.length===12&&rs.filter(r=>r!=='平民').every(r=>s.players.filter(p=>p.role===r).length===rs.filter(x=>x===r).length);}
function updateCupidFaction(){if(!cupidReady()||s.cupid.lovers.length!==2)return;const [a,b]=s.cupid.lovers.map(player),mixed=wolf(a)!==wolf(b);if(s.cupid.third!==mixed){s.cupid.third=mixed;log(mixed?`人狼戀第三方：${thirdMembers().map(who).join('、')}`:'恋人同陣營，維持原陣營');}}
function thirdMembers(){ensureCupid();return s.cupid.third?[...new Set([s.cupid.cupidId,...s.cupid.lovers])]:[];}
function cupidAlignment(p){return thirdMembers().includes(p.id)?'第三方':wolf(p)?'狼人':'好人';}
function cupidSeatStatus(p){if(!isCupid())return p.alive?'存活':'已出局';ensureCupid();return [p.alive?'存活':'已出局',s.cupid.speakers.includes(p.id)?'保留發言權／無投票權':'',s.cupid.lovers.includes(p.id)?'戀人':'',s.cupid.third===null?'':cupidAlignment(p),p.id===s.cupid.thiefId?'原盜賊':''].filter(Boolean).join(' · ');}
function cupidRegister(k,selected){const rs=cupidRegRoles(k),ids=selected||rs.map((_,i)=>+readHostValue('cr'+i));if(ids.some(id=>player(id)?.role!=='未確認')||new Set(ids).size!==ids.length)return alert('請選擇不同且尚未登記的座號。');mutate(()=>{ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`);if(rs[i]==='盜賊')s.cupid.thiefId=id;if(rs[i]==='丘比特')s.cupid.cupidId=id;});if(cupidReady()){const unknown=s.players.filter(p=>p.role==='未確認');if(unknown.length!==cupidExpected().filter(r=>r==='平民').length-s.players.filter(p=>p.role==='平民').length)throw Error('認牌數量不符');unknown.forEach(p=>p.role='平民');updateCupidFaction();}});}
function setCupidReserve(slot,roleName){if(!isCupid()||s.phase!=='night'||s.n!==1||s.step!==0||!CUPID_CARD_ROLES.includes(roleName))return;ensureCupid();s.cupid.reserve[slot]=roleName;save();render();}
