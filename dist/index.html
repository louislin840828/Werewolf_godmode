nightSteps=function(){return isCupid()?[...(s.n===1?['reserve','thief','cupid','lovers']:[]),'wolves','witch','seer','hunter',...(s.n===1?['idiot']:[]),'review']:cupidBase.nightSteps();};
start=function(){if(!isCupid())return cupidBase.start();mutate(()=>{s.cupid={reserve:['',''],pick:-1,thiefId:0,cupidId:0,lovers:[],third:null,speakers:[],voting:false,action:null,deathBatch:null};s.players.forEach(p=>p.role='未確認');s.phase='night';log('模板：盜賊／丘比特，14 張牌發 12 席＋2 備選；盜賊與丘比特不能進備選');log('規則：'+rulesText());});};
function cupidNightModel(){ensureCupid();const k=nightSteps()[s.step],rs=cupidRegRoles(k),d=s.draft,m={kind:'night',title:CUPID_TITLES[k],eyebrow:'NIGHT '+String(s.n).padStart(2,'0'),line:'',actions:[],detail:'',symbol:'moon',confirm:'請閉眼 · 下一位'};if(rs){m.kind='register';m.title=CUPID_TITLES[k]+' · 認牌';m.line=k==='wolves'?'「參與今晚狼刀的狼人請睜眼。」':`「${rs[0]}請睜眼。」`;m.symbol='person';m.confirm='確認身分';return m;}
if(k==='reserve'){m.kind='reserve';m.line='「全體保持閉眼。」';m.detail='上帝確認未發給玩家的兩張備選牌；盜賊將是第一個睜眼角色。';m.symbol='scroll';m.confirm='確認兩張備選牌';}
if(k==='thief'){m.kind='thief';m.symbol='scroll';m.line='「盜賊請睜眼，選擇一張備選身分牌。」';m.detail=s.cupid.reserve.some(r=>['狼人','狼王'].includes(r))?'上帝專用：備選有狼人，必須選狼。':'上帝專用：兩張自由擇一，不能放棄。';m.confirm='確認換牌';}
if(k==='cupid'){m.symbol='crown';m.line='「丘比特請睜眼，指定兩位戀人。」';m.actions=[action('loveA','戀人一','crown',alive(),false),action('loveB','戀人二','crown',alive(),false)];m.detail='兩位必須不同，可以包含丘比特本人。';}
if(k==='lovers'){m.symbol='crown';m.line='「戀人請睜眼，確認彼此後閉眼。」';m.detail='上帝專用：'+s.cupid.lovers.map(who).join('、')+'；僅互認座號，不告知彼此身分。';}
if(k==='wolves'){m.symbol='claw';m.line='「參與今晚狼刀的狼人請睜眼。請選擇今晚的擊殺目標。」';if(alive().some(wolf))m.actions=[action('kill','狼刀','claw')];}
if(k==='witch'){m.symbol='bottle';m.line='「女巫請睜眼，確認是否使用藥物。」';const p=role('女巫');if(p?.alive){const self=s.rules.self==='yes'||s.rules.self==='first'&&s.n===1;if(s.heal&&d.kill&&(self||d.kill!==p.id))m.actions.push(action('save','解藥','bottle',[player(d.kill)]));if(s.poison)m.actions.push(action('poison','毒藥','bottle'));m.detail=s.heal?`今晚刀口：${who(d.kill)}。每晚最多一瓶藥。`:'解藥已耗盡，不再告知刀口。';}else m.detail='上帝專用：女巫未在場或已出局；保留固定口令。';}
if(k==='seer'){m.symbol='eye';m.line='「預言家請睜眼，選擇查驗對象。」';if(role('預言家')?.alive)m.actions=[action('check','查驗陣營','eye',alive().filter(p=>p.role!=='預言家'),false)];else m.detail='上帝專用：預言家未在場或已出局；保留固定口令。';}
if(k==='hunter'){m.symbol='gun';m.line='「獵人請睜眼，確認開槍狀態。」';m.detail=role('獵人')?.alive?(gunOK(role('獵人').id)?'上帝專用：可開槍；若為殉情者則不能開槍。':'上帝專用：中毒，不能開槍。'):'上帝專用：獵人未在場或已出局；保留固定口令。';}
if(k==='idiot'){m.symbol='person';m.line='「白痴請睜眼，確認身分。」';m.detail=role('白痴')?'上帝專用：首次白天被放逐算死亡，保留發言權。':'上帝專用：白痴已埋牌，不在場。';}
if(k==='review'){m.kind='review';m.symbol='sun';m.title='夜晚的選擇，已經落定';m.line='夜間行動已完成。';m.confirm=s.elected?'準備迎接黎明':'進入警長競選';const c=outcomes();m.detail=Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)} · ${rs.join('、')}`).join(' ／ '):'平安夜';}return m;}
nextNight=function(){if(!isCupid())return cupidBase.nextNight();ensureCupid();const k=nightSteps()[s.step],d=s.draft;if(cupidRegRoles(k))return cupidRegister(k);if(k==='reserve'){const rs=s.cupid.reserve;if(rs.some(r=>!CUPID_CARD_ROLES.includes(r))||rs.some(r=>rs.filter(x=>x===r).length>CUPID_DECK.filter(x=>x===r).length))return alert('備選牌必須符合牌池數量，不能包含盜賊或丘比特。');return mutate(()=>{log('盜賊備選牌：'+rs.join('、'));s.step++;});}if(k==='thief'){const i=d.thiefPick;if(![0,1].includes(i))return alert('盜賊必須選擇一張牌。');if(s.cupid.reserve.some(r=>['狼人','狼王'].includes(r))&&!['狼人','狼王'].includes(s.cupid.reserve[i]))return alert('備選有狼人，必須選狼。');return mutate(()=>{s.cupid.pick=i;player(s.cupid.thiefId).role=s.cupid.reserve[i];log(`盜賊 ${who(s.cupid.thiefId)} → ${s.cupid.reserve[i]}；埋牌 ${s.cupid.reserve[1-i]}`);s.step++;});}if(k==='cupid'){if(!player(d.loveA)?.alive||!player(d.loveB)?.alive||d.loveA===d.loveB)return alert('丘比特必須選擇兩位不同的存活玩家。');return mutate(()=>{s.cupid.lovers=[d.loveA,d.loveB];log('丘比特連結：'+s.cupid.lovers.map(who).join('、'));updateCupidFaction();s.step++;});}if(k==='seer'&&role('預言家')?.alive&&!d.check)return alert('請先選擇查驗對象。');if(d.save&&d.poison)return alert('女巫每晚最多一瓶藥。');if(k==='review'&&(!cupidReady()||s.players.some(p=>p.role==='未確認')))return alert('請完成本局所有在場角色認牌。');mutate(()=>{if(k==='hunter')recordHunterBriefing();if(k!=='review'){s.step++;return}updateCupidFaction();s.nightResult=outcomes();log(`夜間行動：狼刀 ${who(d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);if(d.save)s.heal=false;if(d.poison)s.poison=false;s.cupid.voting=false;s.cupid.action=null;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1;});};
backNight=function(){if(!isCupid())return cupidBase.backNight();if(!s.step)return;if(s.n===1&&s.step<=4)return toast('換牌與連結會影響後續認牌，請使用手冊中的撤回操作。');mutate(()=>{s.step--;const fields={wolves:['kill'],witch:['save','poison'],seer:['check']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]));});};
outcomes=function(){if(!isCupid())return cupidBase.outcomes();const d=s.draft,c={},add=(id,why)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(why)};if(d.kill&&!d.save)add(d.kill,'狼隊刀');add(d.poison,'女巫毒');if(s.cupid.lovers.length===2){const [a,b]=s.cupid.lovers;if(c[a]&&!c[b])add(b,'殉情');else if(c[b]&&!c[a])add(a,'殉情');}return c;};
kill=function(id,reason){if(!isCupid())return cupidBase.kill(id,reason);ensureCupid();const p=player(id);if(!p?.alive)return;const before=s.pending.length;if(p.role==='白痴'&&reason==='放逐'&&s.phase==='day'){s.cupid.speakers.push(p.id);log(`${who(id)} 白痴翻牌，計入死亡；保留發言權，失去投票權`);}cupidBase.kill(id,reason);if(reason==='殉情'){s.pending.splice(before);log(`${who(id)} 為殉情者，不能發動任何出局技能`);}else if(p.role==='狼王'&&!reason.includes('毒')&&reason!=='自爆')s.pending.push({id:p.id,guns:1});if(s.cupid.lovers.includes(p.id)){const mate=s.cupid.lovers.find(x=>x!==p.id);if(player(mate)?.alive)kill(mate,s.cupid.deathBatch?.[mate]?.join('＋')||'殉情');}};
settle=function(){if(!isCupid())return cupidBase.settle();mutate(()=>{s.cupid.deathBatch=clone(s.nightResult||{});log(Object.keys(s.nightResult||{}).length?'公布夜間死訊':'公布：平安夜');Object.entries(s.nightResult||{}).forEach(([id,c])=>kill(+id,c.join('＋')));s.cupid.deathBatch=null;s.nightResult=null;s.phase='day';s.voteDone=false;s.votes={};s.pk=[];s.voteRound=1;s.cupid.voting=false;s.cupid.action=null;checkWin();});};
winner=function(){if(!isCupid())return cupidBase.winner();if(s.pending.length)return '';const team=thirdMembers(),living=alive();if(team.length&&living.length&&living.every(p=>team.includes(p.id)))return '第三方陣營獲勝';if(!living.some(wolf))return '好人陣營獲勝';if(!living.some(p=>p.role==='平民')||!living.some(p=>['預言家','女巫','獵人','白痴'].includes(p.role)))return '狼人陣營獲勝';return '';};
roleStatus=function(id){const st=cupidBase.roleStatus(id);if(!isCupid()||!st)return st;return {...st,alignment:cupidAlignment(player(id)),lover:s.cupid.lovers.includes(+id),originalThief:s.cupid.thiefId===+id,canSpeak:player(id).alive||s.cupid.speakers.includes(+id),canVote:player(id).alive};};

gunOK=function(id){if(isCupid()&&(outcomes()[id]||[]).includes('殉情'))return false;return cupidBase.gunOK(id);};

function cupidCanAct(){ensureCupid();return isCupid()&&['day','election'].includes(s.phase)&&!s.voteDone&&!s.cupid.voting&&!Object.keys(s.votes).length&&!s.pending.length&&!s.badge&&!s.cupid.action;}
function beginCupidVote(){if(!cupidCanAct())return;mutate(()=>{s.cupid.voting=true;log(s.phase==='election'?'開始警長投票；自爆關閉':'開始放逐投票；自爆關閉');});}
function openCupidAction(){if(!cupidCanAct())return toast('投票開始後不能自爆。');mutate(()=>s.cupid.action={kind:'explode',target:0});}
function cancelCupidAction(){if(!isCupid()||!s.cupid.action)return;mutate(()=>s.cupid.action=null);}
function cupidActionModel(){return {kind:'cupidAction',title:'狼人 · 自爆',eyebrow:'BEFORE THE VOTE',line:'選擇要自爆的狼人。',symbol:'claw',actions:[action('cupidTarget','自爆者','claw',alive().filter(wolf),false)],confirm:'確認狼人自爆'};}
function cupidFinishTransition(){checkWin();if(s.afterBoom&&!s.pending.length&&!s.badge&&!s.winner){s.afterBoom=false;newNight();}}
function resolveCupidAction(){const a=s.cupid.action,p=player(a?.target);if(!a||!p?.alive||!wolf(p))return toast('請選擇存活狼人。');if(!['day','election'].includes(s.phase)||s.voteDone||s.cupid.voting||Object.keys(s.votes).length||s.pending.length||s.badge)return toast('目前不能自爆。');mutate(()=>{s.cupid.action=null;const election=s.phase==='election';kill(p.id,'自爆');if(election){consumeElectionExplosion();s.phase='dawn';s.cupid.deathBatch=clone(s.nightResult||{});Object.entries(s.nightResult||{}).forEach(([id,c])=>kill(+id,c.join('＋')));s.cupid.deathBatch=null;s.nightResult=null;s.phase='day';}s.afterBoom=true;cupidFinishTransition();});}
boom=function(){if(!isCupid())return cupidBase.boom();openCupidAction();};
candidate=function(id,on){if(isCupid()&&(s.cupid?.voting||s.cupid?.action))return;cupidBase.candidate(id,on);};
badge=function(){if(!isCupid())return cupidBase.badge();const id=+readHostValue('badge');if(id&&!player(id)?.alive)return;mutate(()=>{s.sheriff=id;s.badge=false;log(id?`警徽移交 ${who(id)}`:'警徽撕毀');cupidFinishTransition();});};

newNight=function(){if(isCupid()){ensureCupid();s.cupid.voting=false;s.cupid.action=null;s.cupid.deathBatch=null;}cupidBase.newNight();};

// Presentation only. Read frozen snapshots; submit controller / engine commands.
const cupidBaseViews={setupUI,nightUI,dayUI,electionUI,voteUI};
setupUI=function(){if(!isCupid())return cupidBaseViews.setupUI();const html=baseViews.setupUI().replace('4 狼 · 4 神 · 4 民','12 席 · 14 張牌 · 2 備選').replace('<div class="setupgrid">',`<div class="template-picker"><label>今晚的遊戲模板</label><select onchange="changeBoard(this.value)">${Object.entries(BOARD_TEMPLATES).map(([id,t])=>`<option value="${id}" ${viewState().board===id?'selected':''}>${t.label}</option>`).join('')}</select></div><div class="setupgrid">`),a=html.indexOf('<details open>'),b=html.indexOf('</details>',a)+10;return html.slice(0,a)+`<details open><summary>盜賊／丘比特 · 本桌規則</summary><p>14 張牌：預言家、女巫、獵人、白痴＋5 平民＋狼王、2 普通狼＋盜賊、丘比特。12 席；2 張備選不得含盜賊、丘比特。</p><label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)">${[['no','全程不可自救'],['first','僅首夜可自救'],['yes','全程可自救']].map(([v,t])=>`<option value="${v}" ${viewState().rules.self===v?'selected':''}>${t}</option>`).join('')}</select><label class="check"><input type="checkbox" ${viewState().rules.double?'checked':''} onchange="GameEngine.setRule('double',this.checked)">雙爆吞警徽</label><p class="tiny">盜賊首夜第一個睜眼，從備選牌選一張，另一張埋掉。備選有狼人必須選狼；當晚即取得新角色技能。實際配置依埋牌結果核對。</p><p class="tiny">丘比特首夜必須指定兩名不同玩家，可以包含自己；戀人單獨互認，不查看彼此身分。一人因任何原因死亡，另一人立即殉情，殉情者不能發動任何技能。</p><p class="tiny">同陣營戀人維持原陣營；人狼戀形成丘比特＋兩位戀人的第三方（丘比特本人為戀人時不重複計人），其他玩家全部出局即第三方獲勝。先完成殉情與全部出局槍，再判第三方清場；好人／狼人沿用原有屠邊條件，查驗與神民分類按身分牌。</p><p class="tiny">獵人／狼王為原始死亡者時，非中毒、非自爆可開槍；殉情者不能開槍。同夜本就被刀／毒的戀人保留自己的直接死因。白痴首次白天被放逐即死亡、公布身分、觸發殉情，保留發言權但無投票權；其他死亡不保留發言權。警長死亡仍移交警徽。</p></details>`+html.slice(b);};
function cupidSpecialTray(m){if(m.kind==='reserve')return `<div class="reserve-slots">${[0,1].map(i=>`<label>備選牌 ${i+1}<select aria-label="備選牌 ${i+1}" onchange="setCupidReserve(${i},this.value)"><option value="">選擇身分牌</option>${CUPID_CARD_ROLES.map(r=>`<option ${viewState().cupid.reserve[i]===r?'selected':''}>${r}</option>`).join('')}</select></label>`).join('')}</div>`;if(m.kind==='thief'){const mandatory=viewState().cupid.reserve.some(r=>['狼人','狼王'].includes(r));return `<div class="thief-cards">${viewState().cupid.reserve.map((r,i)=>`<button class="thief-card ${viewState().draft.thiefPick===i?'on':''}" onclick="chooseThiefCard(${i})" ${mandatory&&!['狼人','狼王'].includes(r)?'disabled':''}>${portrait(r)}<strong>${r}</strong><small>${viewState().draft.thiefPick===i?'已選擇':mandatory&&!['狼人','狼王'].includes(r)?'必須選狼':'點選此牌'}</small></button>`).join('')}</div>`;}return '';}
nightUI=function(){if(!isCupid())return cupidBaseViews.nightUI();const k=nightSteps()[viewState().step],rs=cupidRegRoles(k);if(rs)return `<h2>${CUPID_TITLES[k]} · 認牌</h2>${rs.map((r,i)=>`<label>${r}</label><select id="cr${i}">${options(viewState().players.filter(p=>p.role==='未確認'),0,'請選擇座號')}</select>`).join('')}<button class="primary" onclick="nextNight()">確認身分</button>`;const m=cupidNightModel();return `<h2>${m.title}</h2><p class="callout">${m.line}</p><div class="notice">${esc(m.detail)}</div>${cupidSpecialTray(m)}${m.actions.map(a=>selectField(a.field,a.name,a.targets.map(player))).join('')}<button class="primary" onclick="nextNight()">確認並繼續</button>`;};
function cupidPowerButtons(){return cupidCanAct()&&alive().some(wolf)?`<button class="day-power" onclick="openCupidAction()">${portrait('狼人')}<span><strong>狼人自爆</strong><small>結束白天</small></span>${icon('flame')}</button>`:'';}
dayUI=function(){if(!isCupid())return cupidBaseViews.dayUI();return viewState().cupid.action?'<h2>自爆確認中</h2>':`<h2>白天議事</h2>${viewState().voteDone?'<p>今日放逐已完成。</p><button onclick="endDay()">入夜</button>':viewState().cupid.voting?voteUI():`<div class="day-powers">${cupidPowerButtons()}</div><button class="primary" onclick="beginCupidVote()">開始放逐投票</button>`}`;};
electionUI=function(){if(!isCupid())return cupidBaseViews.electionUI();if(viewState().cupid.action)return '<h2>自爆確認中</h2>';return `<h2>警長競選</h2>${viewState().cupid.voting?voteUI(true):`<div class="votes">${alive().map(p=>`<label class="check"><input type="checkbox" ${viewState().candidates.includes(p.id)?'checked':''} onchange="candidate(${p.id},this.checked)">${who(p.id)}</label>`).join('')}</div><div class="day-powers">${cupidPowerButtons()}</div><button onclick="beginCupidVote()" ${!viewState().candidates.length?'disabled':''}>開始警長投票</button><button onclick="noSheriff()">無警長</button>`}`;};
function cupidRosterSummary(){return `<p class="drawer-sub">戀人：${esc(viewState().cupid.lovers.map(who).join('、')||'尚未連結')}<br>陣營：${viewState().cupid.third===null?'待認牌完成':viewState().cupid.third?'第三方 · '+esc(thirdMembers().map(who).join('、')):'戀人維持原陣營'}${viewState().cupid.pick>=0?'<br>盜賊取得 '+esc(viewState().cupid.reserve[viewState().cupid.pick])+'；埋牌 '+esc(viewState().cupid.reserve[1-viewState().cupid.pick]):''}</p>`;}

// Standard 12-seat seer / witch / hunter / idiot board; Cupid house rules stay separate.
const classicBase={start,nightSteps,nextNight,backNight,outcomes,kill};
const CLASSIC_REG={wolves:['狼人','狼人','狼人','狼人'],witch:['女巫'],seer:['預言家'],hunter:['獵人'],idiot:['白痴']};
const CLASSIC_TITLES={wolves:'狼隊',witch:'女巫',seer:'預言家',hunter:'獵人',idiot:'白痴 · 首夜認牌',review:'夜間結算'};
function classicRegRoles(k){const rs=CLASSIC_REG[k];return s.n===1&&rs&&rs.some(r=>s.players.filter(p=>p.role===r).length<rs.filter(x=>x===r).length)?rs:null;}
function classicReady(){return boardDefinition().roles.every(r=>s.players.filter(p=>p.role===r).length===boardDefinition().roles.filter(x=>x===r).length);}
function classicRegister(k,ids){const rs=classicRegRoles(k);if(!rs||!Array.isArray(ids)||ids.length!==rs.length||new Set(ids).size!==ids.length||ids.some(id=>!player(id)?.alive||player(id).role!=='未確認'))return alert('請選擇不同且尚未確認身分的座號。');mutate(()=>{ids.forEach((id,i)=>{player(id).role=rs[i];log(`首夜認牌 ${who(id)} → ${rs[i]}`);});if(s.players.filter(p=>p.role==='未確認').length===4&&Object.values(CLASSIC_REG).flat().every(r=>s.players.filter(p=>p.role===r).length===boardDefinition().roles.filter(x=>x===r).length)){s.players.filter(p=>p.role==='未確認').forEach(p=>p.role='平民');log('所有神職與狼人確認完畢；其餘四位確認為平民');}});}
nightSteps=function(){return isClassic()?['wolves','witch','seer','hunter',...(s.n===1?['idiot']:[]),'review']:classicBase.nightSteps();};
start=function(){if(!isClassic())return classicBase.start();mutate(()=>{s.players.forEach(p=>{p.role='未確認';delete p.idiotRevealed;});s.phase='night';log('模板：預女獵白，4 普通狼人＋預言家、女巫、獵人、白痴＋4 平民');log('規則：'+rulesText());});};
function classicNightModel(){const k=nightSteps()[s.step],rs=classicRegRoles(k),d=s.draft,m={kind:'night',title:CLASSIC_TITLES[k],eyebrow:'NIGHT '+String(s.n).padStart(2,'0'),line:'',detail:'',actions:[],symbol:'moon',confirm:'請閉眼 · 下一位'};if(rs)return {...m,kind:'register',title:CLASSIC_TITLES[k]+' · 認牌',line:`「${rs[0]}請睜眼，確認身分。」`,detail:'先登記睜眼者，再於同一回合執行技能；其餘玩家暫不推定為平民。',symbol:'person',confirm:'確認身分'};
 if(k==='wolves'){m.symbol='claw';m.line=WOLF_CALL;if(alive().some(wolf))m.actions=[action('kill','狼刀','claw')];else m.detail='狼隊已出局，保留口令與停頓。';}
 if(k==='witch'){m.symbol='bottle';m.line='「女巫，你要使用哪一瓶藥？」';if(role('女巫')?.alive){const canSelf=s.rules.self==='yes'||s.rules.self==='first'&&s.n===1;if(s.heal&&d.kill&&(canSelf||player(d.kill)?.role!=='女巫'))m.actions.push(action('save','解藥','bottle',[player(d.kill)]));if(s.poison)m.actions.push(action('poison','毒藥','bottle'));m.detail=s.heal?`今晚刀口：${who(d.kill)}。每晚只能使用一瓶藥。`:'解藥已耗盡，不再告知刀口。';}else m.detail='女巫已出局，保留口令與停頓。';}
 if(k==='seer'){m.symbol='eye';m.line='「預言家請睜眼，選擇查驗對象。」';if(role('預言家')?.alive)m.actions=[action('check','查驗','eye',alive().filter(p=>p.role!=='預言家'),false)];else m.detail='預言家已出局，保留口令與停頓。';}
 if(k==='hunter'){m.symbol='gun';m.line='「獵人請睜眼，確認開槍狀態。」';}
 if(k==='idiot'){m.symbol='person';m.line='「白痴請睜眼，確認身分。」';m.detail='首次放逐翻牌後仍存活、保留發言權但失去投票權，仍計入神邊；刀、毒、槍正常致死。';}
 if(k==='review'){m.kind='review';m.symbol='sun';m.line='確認夜間行動，再讓村莊迎接黎明。';const c=outcomes();m.detail=Object.keys(c).length?Object.entries(c).map(([id,rs])=>`${who(id)} · ${rs.join('、')}`).join(' ／ '):'平安夜';m.confirm=s.elected?'準備迎接黎明':'進入警長競選';}
 return m;}
nextNight=function(){if(!isClassic())return classicBase.nextNight();const k=nightSteps()[s.step],d=s.draft;if(classicRegRoles(k))return alert('請先完成本回合認牌。');if(k==='seer'&&role('預言家')?.alive&&!d.check)return alert('請先選擇查驗對象。');if(d.save&&d.poison)return alert('女巫每晚最多一瓶藥。');if(k==='review'&&!classicReady())return alert('請完成本局所有角色認牌。');mutate(()=>{if(k==='hunter')recordHunterBriefing();if(k!=='review'){s.step++;return;}s.nightResult=outcomes();log(`夜間行動：狼刀 ${who(d.kill)}；女巫${d.save?'救人':'不救'}／毒 ${who(d.poison)}`);if(d.check)log(`預言家查驗 ${who(d.check)} → ${result(d.check)}`);if(d.save)s.heal=false;if(d.poison)s.poison=false;s.phase=s.elected?'dawn':'election';s.votes={};prepareElectionAfterNight();s.pk=[];s.voteRound=1;});};
backNight=function(){if(!isClassic())return classicBase.backNight();if(!s.step)return;mutate(()=>{s.step--;const fields={wolves:['kill'],witch:['save','poison'],seer:['check'],hunter:['hunterBriefing']};nightSteps().slice(s.step+1).forEach(k=>(fields[k]||[]).forEach(f=>delete s.draft[f]));});};
outcomes=function(){if(!isClassic())return classicBase.outcomes();const c={},d=s.draft,add=(id,label)=>{if(id&&player(id)?.alive)(c[id]??=[]).push(label);};if(d.kill&&!d.save)add(d.kill,'狼隊刀');add(d.poison,'女巫毒');return c;};
kill=function(id,reason){if(!isClassic())return classicBase.kill(id,reason);const p=player(id);if(p?.alive&&p.role==='白痴'&&reason==='放逐'&&s.phase==='day'){if(!p.idiotRevealed){p.idiotRevealed=true;log(`${who(id)} 白痴翻牌，仍存活並計入神邊；保留發言權，失去投票權`);}return;}classicBase.kill(id,reason);};

// Classic board presentation; state changes go through the engine/controller.

setupUI=function(){if(!isClassic())return classicBaseViews.setupUI();const html=baseViews.setupUI(),a=html.indexOf('<details open>'),b=html.indexOf('</details>',a)+10;return html.slice(0,a)+`<details open><summary>預女獵白 · 本桌規則</summary><p>4 普通狼人｜預言家、女巫、獵人、白痴｜4 平民。12 人警長屠邊局。</p><label>女巫自救</label><select onchange="GameEngine.setRule('self',this.value)">${[['no','全程不可自救'],['first','僅首夜可自救'],['yes','全程可自救']].map(([v,t])=>`<option value="${v}" ${viewState().rules.self===v?'selected':''}>${t}</option>`).join('')}</select><label class="check"><input type="checkbox" ${viewState().rules.double?'checked':''} onchange="GameEngine.setRule('double',this.checked)">雙爆吞警徽</label><p>白痴首次被放逐翻牌後仍存活，可發言但不能投票，仍計入神職存活；刀、毒、槍正常致死。</p><p>女巫每晚最多一瓶藥；獵人中毒不能開槍。完整死亡批次先判勝，未分勝負才處理出局技能。</p><p>夜序：狼隊 → 女巫 → 預言家 → 獵人 → 白痴認牌（僅首夜）→ 夜間結算。</p></details>`+html.slice(b);};
nightUI=function(){if(!isClassic())return classicBaseViews.nightUI();const m=nightModel();if(m.kind==='register')return `<h2>${esc(m.title)}</h2><p class="notice">請在村莊座位確認本回合睜眼者。</p>`;return `<h2>${esc(m.title)}</h2><p class="callout">${esc(m.line)}</p><p class="notice">${esc(m.detail)}</p><p>請使用村莊的技能目標與主確認按鈕完成本回合。</p>`;};

// Shared sheriff procedure. Nomination history survives withdrawals and night interruptions.
const sheriffBase={candidate,countVotes,electWinner,noSheriff,boom};
function ensureElection(){if(!s.election){const voting=Object.keys(s.votes||{}).length||s.voteRound>1||[s.white,s.blood,s.dream,s.cupid].some(x=>x?.voting);s.election={stage:voting?'vote':'nomination',registered:[...s.candidates],withdrawn:[],resume:null,lossPending:false,action:false,target:0};}return s.election;}
function setSheriffVoting(on){for(const x of [s.white,s.blood,s.dream,s.cupid])if(x)x.voting=on;}
function prepareElectionAfterNight(){if(s.elected)return;const e=ensureElection();s.candidates=s.candidates.filter(id=>player(id)?.alive);if(e.resume==='lost'||e.lossPending){e.stage='badgeLost';e.resume=null;s.sheriff=0;setSheriffVoting(false);return;}if(e.resume==='withdraw'){e.stage='withdraw';e.resume=null;setSheriffVoting(false);log('恢復警長競選：警上發言已沒收，進入退水；仍在警上 '+(s.candidates.map(who).join('、')||'無'));return;}setSheriffVoting(e.stage==='vote');}
function sheriffForfeit(){const e=ensureElection();return s.boom>0||['withdraw','vote','pkSpeeches'].includes(e.stage)?'vote':'speeches';}
function consumeElectionExplosion(){const e=ensureElection(),forfeit=sheriffForfeit();e.registered=[...new Set([...e.registered,...s.candidates])];s.boom++;e.action=false;e.target=0;s.votes={};s.pk=[];s.voteRound=1;setSheriffVoting(false);if(!s.rules.double||forfeit==='vote'){e.voteForfeited=true;e.lossPending=true;e.resume='lost';e.stage='paused';s.sheriff=0;s.badge=false;log(`第 ${s.boom} 次警長競選自爆：沒收警長投票環節；下一個天亮確認無警徽`);}else{e.speechesForfeited=true;e.resume='withdraw';e.stage='paused';log('第一次警長競選自爆：沒收警上發言環節，保留仍在警上的候選人；下一個天亮退水');}}
function sheriffTargets(){return (s.pk.length?s.pk:s.candidates).filter(id=>player(id)?.alive);}
function sheriffVoters(){const e=ensureElection(),excluded=s.voteRound===1?e.registered:s.candidates;return alive().filter(p=>RoleSystem.state(s,p.id).canVote&&!excluded.includes(p.id));}
function sheriffCanExplode(){const e=ensureElection();return s.phase==='election'&&!s.elected&&!s.pending.length&&!s.badge&&!e.lossPending&&!e.action&&!['paused','badgeLost'].includes(e.stage);}
function sheriffExploders(){return alive().filter(p=>wolf(p)&&p.role!=='狼兄'&&p.role!=='石像鬼'&&(p.role!=='機械狼'||s.rules.mechBoom));}
function openElectionExplosion(){if(!sheriffCanExplode()||!sheriffExploders().length)return;mutate(()=>{const e=ensureElection();e.action=true;e.target=0;});}
function cancelElectionExplosion(){if(s.phase!=='election')return;mutate(()=>{const e=ensureElection();e.action=false;e.target=0;});}
function resolveElectionExplosion(){const e=ensureElection(),p=player(e.target);if(s.phase!=='election'||!e.action||!sheriffExploders().some(x=>x.id===p?.id)||s.pending.length||s.badge)return toast('請選擇可以自爆的存活狼人。');mutate(()=>{kill(p.id,'自爆');if(isBloodMoon()&&p.role==='血月使者'){ensureBlood();s.blood.sealedNight=s.n+1;log(`血月降臨：第 ${s.blood.sealedNight} 夜好人技能封印`);}consumeElectionExplosion();s.phase='dawn';if(isCupid())s.cupid.deathBatch=clone(s.nightResult||{});if(isDream())s.dream.nightResolving=true;Object.entries(s.nightResult||{}).forEach(([id,causes])=>kill(+id,causes.join('＋')));if(isCupid())s.cupid.deathBatch=null;s.nightResult=null;s.phase='day';s.afterBoom=true;checkWin();if(!s.winner&&!s.pending.length&&!s.badge){s.afterBoom=false;newNight();}});}
function setWithdrawal(id,on){const e=ensureElection();if(s.phase!=='election'||e.stage!=='withdraw'||!e.registered.includes(id)||!player(id)?.alive)return;mutate(()=>{e.withdrawn=on?[...new Set([...e.withdrawn,id])]:e.withdrawn.filter(x=>x!==id);s.candidates=e.registered.filter(x=>player(x)?.alive&&!e.withdrawn.includes(x));s.votes={};s.pk=[];s.voteRound=1;});}
function beginSheriffSpeeches(){const e=ensureElection();if(e.stage!=='nomination')return;if(!s.candidates.length)return noSheriff();mutate(()=>{e.registered=[...s.candidates];e.withdrawn=[];e.stage='speeches';log('警上發言：'+s.candidates.map(who).join('、'));});}
function beginWithdrawal(){const e=ensureElection();if(e.stage!=='speeches')return;mutate(()=>{e.stage='withdraw';log('警上發言結束，進入退水環節');});}
function beginSheriffVote(){const e=ensureElection();if(!['withdraw','pkSpeeches'].includes(e.stage))return;if(!sheriffTargets().length)return noSheriff();mutate(()=>{e.stage='vote';setSheriffVoting(true);s.votes={};log(`開始第 ${s.voteRound} 輪警長投票；退水 ${e.withdrawn.map(who).join('、')||'無'}；有投票權 ${sheriffVoters().map(p=>who(p.id)).join('、')||'無'}`);});}
function finishWithoutBadge(reason,note=''){const e=ensureElection();e.stage='done';e.lossPending=false;e.resume=null;s.elected=true;s.sheriff=0;s.badge=false;s.phase='dawn';setSheriffVoting(false);recordVoteResult(true,'lost',{note});log(reason);}
candidate=function(id,on){if(s.phase!=='election')return sheriffBase.candidate(id,on);const e=ensureElection();if(e.stage!=='nomination'||!player(id)?.alive||e.action)return;mutate(()=>{s.candidates=on?[...new Set([...s.candidates,id])]:s.candidates.filter(x=>x!==id);e.registered=[...s.candidates];e.withdrawn=[];s.votes={};s.pk=[];s.voteRound=1;});};
electWinner=function(id){ensureElection().stage='done';setSheriffVoting(false);sheriffBase.electWinner(id);};
noSheriff=function(){if(confirm('確認本局無警長、警徽流失？'))mutate(()=>finishWithoutBadge('本局無警長，警徽流失','無人上警或全部退水'));};
countVotes=function(elect){if(!elect)return sheriffBase.countVotes(false);const e=ensureElection(),targets=sheriffTargets(),voters=sheriffVoters();if(e.stage!=='vote')return alert('請先完成警上發言與退水，再開始投票。');if(targets.length===1)return mutate(()=>{electWinner(targets[0]);recordVoteResult(true,'unopposed',{target:targets[0],ballots:{},tally:{}})});if(!targets.length)return alert('本輪沒有候選人。');if(voters.some(p=>s.votes[p.id]===undefined||s.votes[p.id]<0||s.votes[p.id]!==0&&!targets.includes(s.votes[p.id])))return alert('請記錄每位有投票權玩家的選擇，未投票請選棄票。');mutate(()=>{const tally={};for(const p of voters){const id=s.votes[p.id];if(id)tally[id]=(tally[id]||0)+1;}log(`第 ${s.voteRound} 輪警長投票：${voters.map(p=>p.id+'→'+(s.votes[p.id]||'棄')).join('、')}；票數 ${Object.entries(tally).map(([id,n])=>id+' 號 '+n).join('／')||'全棄票'}`);const max=Math.max(0,...Object.values(tally)),wins=Object.keys(tally).filter(id=>tally[id]===max).map(Number);if(wins.length===1){recordVoteResult(true,'elected',{tally,target:wins[0]});electWinner(wins[0]);}else if(wins.length>1&&s.voteRound===1){recordVoteResult(true,'pk',{tally,pk:wins});s.pk=wins;s.voteRound=2;s.votes={};e.stage='pkSpeeches';log('第一輪平票，進入 PK 發言；退水玩家第二輪恢復投票權');}else finishWithoutBadge(wins.length>1?'兩輪警長投票均平票，警徽流失':'警長投票全棄票，警徽流失',wins.length>1?'兩輪均平票':'全數棄票');});};
function sheriffModel(){const e=ensureElection(),m={kind:'candidates',title:'誰將接過警徽？',eyebrow:'SHERIFF ELECTION',line:'有誰要競選警長？',detail:'',symbol:'crown',actions:[],confirm:s.candidates.length?'開始警上發言':'無人上警 · 警徽流失'};if(e.action)return {...m,kind:'electionExplosion',title:'狼人 · 沒收警長環節',line:'選擇要自爆的狼人。',detail:sheriffForfeit()==='vote'?'本次自爆將沒收警長投票；走完一夜後確認無警徽。':'本次自爆將沒收警上發言；保留候選人，走完一夜後退水。',actions:[action('sheriffExploder','自爆者','claw',sheriffExploders(),false)],confirm:'確認自爆 · 入夜'};if(e.stage==='badgeLost')return {...m,kind:'badgeLost',title:'警徽已流失',line:'警長投票環節已被沒收，本局無警徽。',confirm:'確認無警徽 · 公布死訊'};if(e.stage==='speeches')return {...m,kind:'sheriffSpeech',title:'警上發言',line:'警上候選人進行發言。',detail:'仍在警上：'+s.candidates.map(who).join('、'),confirm:'發言結束 · 進入退水'};if(e.stage==='withdraw')return {...m,kind:'withdrawal',title:'警長退水',line:'確認哪些候選人繼續競選。',detail:'退水者第一輪不能投票；若平票，第二輪恢復投票權。',confirm:s.candidates.length?'退水完成 · 開始投票':'全部退水 · 警徽流失'};if(e.stage==='pkSpeeches')return {...m,kind:'pkSpeech',title:'警長 PK 發言',line:'平票候選人進行 PK 發言。',detail:'PK：'+s.pk.map(who).join('、')+'；第二輪由未上警者與已退水者投票。',confirm:'PK 發言結束 · 第二輪投票'};if(e.stage==='vote'){const voters=sheriffVoters(),targets=sheriffTargets();if(!g.voter||!voters.some(p=>p.id===g.voter))g.voter=voters.find(p=>s.votes[p.id]===undefined)?.id||voters[0]?.id||0;return {...m,kind:'vote',title:s.voteRound===2?'警長第二輪投票':'警長第一輪投票',line:g.voter?`${who(g.voter)}，你的票投給誰？`:'本輪準備結算。',detail:s.voteRound===1?'本輪只有未上警玩家可投票。':'退水玩家本輪恢復投票權。',confirm:'揭曉票數',voters,targets,elect:true};}return m;}
function confirmSheriffStage(m){if(m.kind==='electionExplosion')return resolveElectionExplosion();if(m.kind==='candidates')return beginSheriffSpeeches();if(m.kind==='sheriffSpeech')return beginWithdrawal();if(m.kind==='withdrawal'||m.kind==='pkSpeech')return beginSheriffVote();if(m.kind==='badgeLost')return mutate(()=>finishWithoutBadge('警長投票環節已被沒收，確認本局無警徽','投票環節已被沒收'));}
boom=function(){if(s.phase==='election')return openElectionExplosion();return sheriffBase.boom();};

function setSheriffExploder(id){const e=ensureElection();if(s.phase!=='election'||!e.action||!sheriffExploders().some(p=>p.id===id))return;e.target=id;save();render();}

// Presentation only. Read frozen snapshots; submit controller / engine commands.
const sheriffBaseViews={voteUI,electionUI};
voteUI=function(elect=false){if(!elect)return sheriffBaseViews.voteUI(false);const targets=sheriffTargets(),voters=sheriffVoters();return `<h3>警長投票 · 第 ${viewState().voteRound} 輪</h3><div class="votes">${voters.map(p=>`<div><label>${esc(who(p.id))}</label><select onchange="recordVote(${p.id},Number(this.value))"><option value="-1">尚未記錄</option>${options(targets.map(player),viewState().votes[p.id]??-1,'棄票')}</select></div>`).join('')}</div><button class="primary" onclick="countVotes(true)">結算警長票</button>`;};
function sheriffTray(m){const e=viewState().election;let content='';if(m.kind==='withdrawal')content=`<div class="withdrawal-list">${e.registered.filter(id=>player(id)?.alive).map(id=>`<button class="withdrawal-card ${e.withdrawn.includes(id)?'retired':'on'}" onclick="setWithdrawal(${id},${!e.withdrawn.includes(id)})"><strong>${esc(who(id))}</strong><span>${e.withdrawn.includes(id)?'已退水 · 點此恢復':'留在警上 · 點此退水'}</span></button>`).join('')}</div>`;else if(m.kind==='candidates')content=`<div class="candidate-line">上警 ${viewState().candidates.length} 位${viewState().candidates.length?' · '+viewState().candidates.map(id=>id+' 號').join('、'):''}</div>`;else if(m.kind==='pkSpeech')content=votePriorRoundMarkup();if(sheriffCanExplode()&&sheriffExploders().length)content+=`<div class="day-powers"><button class="day-power" onclick="openElectionExplosion()">${portrait('狼人')}<span><strong>狼人自爆</strong><small>${sheriffForfeit()==='vote'?'沒收警長投票':'沒收警上發言'}</small></span>${icon('flame')}</button>${isWhiteKnight()&&whiteCanAct()&&role('騎士')?.alive&&!viewState().white.duelUsed?`<button class="day-power" onclick="openWhiteAction('duel')">${portrait('騎士')}<span><strong>騎士決鬥</strong><small>投票前可用</small></span></button>`:''}</div>`;return content;}
electionUI=function(){const m=sheriffModel();if(m.kind==='vote')return voteUI(true)+sheriffTray(m);return `<h2>${m.title}</h2><p>${esc(m.line)}</p><p class="tiny">${esc(m.detail)}</p>${m.kind==='candidates'?`<div class="votes">${alive().map(p=>`<label class="check"><input type="checkbox" ${viewState().candidates.includes(p.id)?'checked':''} onchange="candidate(${p.id},this.checked)">${esc(who(p.id))}</label>`).join('')}</div>`:''}${m.kind==='electionExplosion'?`<label>自爆者</label><select onchange="setSheriffExploder(Number(this.value))">${options(sheriffExploders(),ensureElection().target)}</select>`:sheriffTray(m)}<button class="primary" onclick="confirmSheriffStage(sheriffModel())">${m.confirm}</button>`;};

// Pure shared role rules. No browser, UI, storage, or global game dependencies.
const RoleSystem=(()=>{
 const VERSION=1,UNKNOWN='未確認';

function currentRegistrationCheckpoint(){

 for(let i=s.history.length-1;i>=0;i--){const before=s.history[i],after=s.history[i+1]||s;

function selectionSummary(m){
 if(m.kind!=='register'&&!m.actions.length)return '';
 let items=[];
 if(m.kind==='register')items=currentReg().map((r,i)=>g.regs[i]?`<span>${esc(r)} <b>${g.regs[i]} 號</b></span>`:'');
 else if(m.gifts){const d=viewState().draft;items=[`<span>交易對象 <b>${d.trade?d.trade+' 號':'尚未選擇'}</b></span>`,`<span>贈送技能 <b>${esc(d.gift||'尚未選擇')}</b></span>`];}
 else if(m.kind==='shot'&&g.shotMode==='skip')items=['<span>開槍處置 <b>放棄開槍</b></span>'];

function exileDeaths(r){
 // Start at the vote transaction. Older deaths and later night deaths do not
 // belong to this exile batch; a legacy save without a cursor stays conservative.
 const offset=r.deathEventId;if(!Number.isInteger(offset))return [];
 return GameEngine.events().filter(e=>e.id>offset&&e.type==='death'&&e.round===r.n&&e.phase==='day');
}
function voteResultMarkup(){const st=viewState(),r=st.voteResult;if(!r||r.n!==st.n)return '';
 if(r.elect?st.phase!=='dawn':!(st.phase==='day'&&st.voteDone&&r.outcome!=='pk'))return '';
 if(st.pending.length||st.badge)return '';
 const chips=Object.entries(r.tally||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([id,n])=>`${id} 號 ${n} 票`).join('／');
 const abstains=Object.values(r.ballots||{}).filter(t=>!t).length;
 const title=r.elect?'警長結果':'放逐結果';
 const outcome=r.elect?(r.outcome==='elected'?`${r.target} 號當選警長`:r.outcome==='unopposed'?`唯一候選人 · ${r.target} 號當選警長`:'警徽流失'):(r.outcome==='exiled'?(st.board==='classic'&&player(r.target)?.alive&&player(r.target)?.idiotRevealed?`${r.target} 號白痴翻牌 · 仍存活`:`${r.target} 號被放逐`):'無人放逐');
 const deaths=!r.elect&&r.outcome==='exiled'?exileDeaths(r):[];
 const details=deaths.length?`<div class="vote-deaths"><small>本次出局 · ${deaths.length} 人</small>${deaths.map(e=>`<span><b>${e.player} 號</b><small>${esc(e.factors.map(f=>f.label).join('、'))}</small></span>`).join('')}</div>`:'';
 return `<div class="vote-results" role="status" aria-live="polite"><small>${title}${r.round>1?' · 第 '+r.round+' 輪':''}</small><strong>${esc(outcome)}</strong>${chips?`<span class="vote-tally">${esc(chips)}${abstains?` · 棄 ${abstains} 票`:''}</span>`:''}${r.note?`<span class="vote-note">${esc(r.note)}</span>`:''}${details}</div>`;}
function votePriorRoundMarkup(){const st=viewState(),r=st.voteResult;if(!r||r.outcome!=='pk'||r.n!==st.n||st.voteRound!==2)return '';
 const chips=Object.entries(r.tally||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(([id,n])=>`${id} 號 ${n} 票`).join('／');
 return `<div class="vote-prior" role="status">上一輪${r.elect?'警長':''}投票${chips?`：${esc(chips)}`:''} · 平票，進入 PK</div>`;}

function boardComposition(id,variant=id===viewState().board?viewState().variant:'standard12'){const counts=new Map();for(const role of boardConfiguration(id,variant).roles)counts.set(role,(counts.get(role)||0)+1);return [...counts].map(([r,n])=>`${r}${n>1?' × '+n:''}`).join(' · ')}
function galleryMove(index,instant=false){const track=document.getElementById('board-track'),cards=track?.querySelectorAll('.board-slide');if(!cards?.length)return;index=Math.max(0,Math.min(cards.length-1,index));const rect=track.getBoundingClientRect(),card=cards[index].getBoundingClientRect();track.scrollTo({left:track.scrollLeft+card.left-rect.left-(rect.width-card.width)/2,behavior:instant||!presentationMotionAllowed()?'instant':'smooth'});}
function gallerySync(){const track=document.getElementById('board-track');if(!track)return;const mid=track.getBoundingClientRect().left+track.clientWidth/2;const cards=[...track.querySelectorAll('.board-slide')];let best=0,dist=Infinity;cards.forEach((el,i)=>{const r=el.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid);if(d<dist){dist=d;best=i}});setupBoardFocus=galleryBoardIds()[best];primeRoleImages();document.getElementById('gallery-count').textContent=`${String(best+1).padStart(2,'0')} / ${String(galleryBoardIds().length).padStart(2,'0')}`;document.getElementById('gallery-selected').textContent=BOARD_TEMPLATES[setupBoardFocus].label;document.querySelectorAll('.gallery-dot').forEach((el,i)=>{el.classList.toggle('active',i===best);el.setAttribute('aria-current',i===best?'true':'false')});document.getElementById('gallery-prev').disabled=best===0;document.getElementById('gallery-next').disabled=best===cards.length-1;}

function galleryOpen(id,event){if(event?.detail&&Date.now()<gallerySuppressClickUntil)return;portraitPreparation++;setupBoardFocus=id;galleryDetail=id;galleryVariant=id===viewState().board?viewState().variant:'standard12';render()}

function galleryDetailMarkup(){if(!galleryDetail||gDrawer)return '';const id=galleryDetail,t=BOARD_TEMPLATES[id],story=BOARD_STORIES[id],config=boardConfiguration(id,galleryVariant);return `<dialog id="gallery-dialog" class="gallery-dialog" aria-labelledby="gallery-dialog-title" oncancel="event.preventDefault();galleryClose()" onclick="if(event.target===this)galleryClose()"><div class="gallery-dialog-inner"><header><span>板子詳情</span><button class="gallery-close" aria-label="關閉板子詳情" onclick="galleryClose()">${icon('x')}</button></header><div class="gallery-detail-body"><div class="board-art art-${story.art.length}">${story.art.map(r=>`<div>${portrait(r)}<span>${r}</span></div>`).join('')}</div><div class="board-copy"><span class="board-tag">${story.tag}</span><h2 id="gallery-dialog-title">${t.title}<em>／ ${t.subtitle}</em></h2><p>${story.text}</p><section class="board-composition">${id==='brothers'?`<label for="gallery-variant">人數與配置</label><select id="gallery-variant" onchange="chooseGalleryVariant(this.value)">${['standard12','wolfking10'].map(v=>`<option value="${v}" ${galleryVariant===v?'selected':''}>${boardConfiguration(id,v).label}</option>`).join('')}</select>`:''}<h3>角色配置 · ${id==='cupid'?'14 張牌，12 人入席':config.playerCount+' 人'}</h3><p>${boardComposition(id,galleryVariant)}</p>${galleryVariant==='wolfking10'?'<p>普通狼王非中毒、非自爆出局且勝負未定時可開一槍；狼隊環節認牌，不設報槍。其餘規則與夜序沿用 12 人版。</p>':''}${id==='cupid'?'<p>2 張盜賊備選牌；盜賊、丘比特必須發給玩家。</p>':''}</section></div></div><footer><button class="commit-btn" onclick="prepareGalleryGame(this)">確認使用 · 開始認牌 ${icon('check')}</button><button class="gallery-settings" onclick="galleryConfirm(true)">規則與玩家暱稱</button></footer></div></dialog>`}
function galleryGestureAxis(dx,dy){if(Math.max(Math.abs(dx),Math.abs(dy))<10)return '';if(Math.abs(dx)>Math.abs(dy)*1.25)return 'x';if(Math.abs(dy)>Math.abs(dx)*1.25)return 'y';return ''}
function bindGalleryGestures(track){if(track.getAttribute?.('data-keyboard-bound'))return;track.setAttribute?.('data-keyboard-bound','true');let drag=null;
 track.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;drag={native:e.pointerType==='touch'||e.pointerType==='pen',id:e.pointerId,x:e.clientX,y:e.clientY,left:track.scrollLeft,index:galleryBoardIds().indexOf(setupBoardFocus),axis:'',dx:0,moved:false}});
 track.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.dx=dx;if(Math.max(Math.abs(dx),Math.abs(dy))>=10){drag.moved=true;gallerySuppressClickUntil=Date.now()+500}if(drag.native)return;if(!drag.axis)drag.axis=galleryGestureAxis(dx,dy);if(drag.axis==='x'){if(e.cancelable)e.preventDefault();track.setPointerCapture(e.pointerId);track.classList.add('dragging');track.scrollLeft=drag.left-dx}});
 const finish=e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;track.classList.remove('dragging');if(d.moved||e.type==='pointercancel')gallerySuppressClickUntil=Date.now()+500;if(!d.native&&d.axis==='x'){if(track.hasPointerCapture(e.pointerId))track.releasePointerCapture(e.pointerId);const shift=e.type==='pointercancel'?0:Math.abs(d.dx)>Math.min(60,track.clientWidth*.15)?(d.dx<0?1:-1):0;galleryMove(d.index+shift)}};
 track.addEventListener('pointerup',finish);track.addEventListener('pointercancel',finish);track.addEventListener('lostpointercapture',finish);
 // Native touch scrolling owns momentum and snapping; never capture or cancel it.
 track.addEventListener('scroll',()=>{gallerySuppressClickUntil=Date.now()+250},{passive:true});
 track.addEventListener('click',e=>{if(e.detail&&Date.now()<gallerySuppressClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
}

function mountHostDrawer(){const drawer=document.querySelector('.game-drawer');if(!drawer)return;const controls=()=>[...drawer.querySelectorAll('button:not(:disabled),select,textarea,input,a[href],summary')].filter(el=>el.getClientRects().length);if(!drawer.contains?.(document.activeElement))controls()[0]?.focus({preventScroll:true});if(drawer.getAttribute?.('data-keyboard-bound'))return;drawer.setAttribute?.('data-keyboard-bound','true');drawer.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeHostDrawer();return}if(e.key==='Tab'){const list=controls(),first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}})}
function closeHostDrawer(){gDrawer='';drawerNavigation='';render();if(drawerReturnFocus?.isConnected)drawerReturnFocus.focus({preventScroll:true});}
function openHostDrawer(kind){if(!gDrawer)drawerReturnFocus=document.activeElement;else if(kind!==gDrawer||detailPlayerId)drawerNavigation='tab';gDrawer=kind;detailPlayerId=0;if(kind==='engine')tab='play';render();}
function openRoleDetail(id){if(!viewState().players.some(p=>p.id===id))return;if(gDrawer==='seats'&&!detailPlayerId){rosterScroll=document.querySelector('.drawer-body')?.scrollTop||0;rosterReturnFocus=document.activeElement;drawerNavigation='forward';}else if(!gDrawer)drawerReturnFocus=document.activeElement;detailPlayerId=id;gDrawer='seats';render();const body=document.querySelector('.drawer-body');if(body)body.scrollTop=0;document.querySelector('.detail-back')?.focus({preventScroll:true});}
function returnToRoster(){detailPlayerId=0;drawerNavigation='back';render();const body=document.querySelector('.drawer-body');if(body)body.scrollTop=rosterScroll;const id=rosterReturnFocus?.getAttribute?.('onclick');const target=id?[...document.querySelectorAll('.host-roster button')].find(el=>el.getAttribute('onclick')===id):null;target?.focus({preventScroll:true});}
function detailSection(title,body){return `<section class="detail-section"><h3>${title}</h3>${body}</section>`}
function hostRosterMarkup(){return `<p class="drawer-sub">${alive().length} / ${viewState().players.length} 存活 · 點選玩家查看詳情</p>${isCupid()?cupidRosterSummary():''}<div class="host-roster">${GameEngine.roles().map(r=>{const p=player(r.id);return `<button onclick="openRoleDetail(${r.id})"><b>${String(r.id).padStart(2,'0')}</b><span>${esc(p.name||'玩家 '+r.id)}<small>${esc(r.currentRole)} · ${r.life==='delayedDeath'?'延後死亡':r.alive?'存活':'已出局'}${r.id===viewState().sheriff?' · 警長':''}</small></span><i>›</i></button>`}).join('')}</div>`}
function skillDetailText(k,r){const out=[];
 if(k.id==='revenge'&&r.progression==='waiting')out.push('尚未覺醒');else if(k.remaining!==null)out.push(k.remaining===0?'剩餘 0 次':'剩餘 '+k.remaining+' 次');else out.push('依回合與條件發動');
 if(k.availableFrom&&k.availableFrom>viewState().n)out.push('第 '+k.availableFrom+' 夜起生效');
 if(k.requires&&!k.enabled&&r.alive)out.push('尚未取得獨立狼刀');
 if(k.blockedBy?.length)out.push(k.blockedBy.map(x=>EFFECT_LABELS[x]||'限制效果').join('、'));
 if(k.previousTarget)out.push('上次目標 '+k.previousTarget+' 號');
 if(['shoot','learnedShoot','gift獵槍','take','lastNight'].includes(k.id))out.push('出局時依死因與規則判定');
 if(!r.alive)out.push('已出局');return out.join(' · ')
}
function knowledgeText(k){const result=k.result;if(k.kind==='gunStatus'&&result&&typeof result==='object')return `獵人狀態：${result.available?'可以開槍':'不能開槍'}${result.reason?'（'+result.reason+'）':''}`;if(k.kind==='loverSeat')return '戀人：'+result+' 號';return `${k.target?k.target+' 號 · ':''}${typeof result==='string'||typeof result==='number'?result:'已確認資訊'}`}
function roleDetailMarkup(id){const r=GameEngine.role(id),p=player(id);if(!r||!p)return hostRosterMarkup();
 let body=`<button class="detail-back" onclick="returnToRoster()">← 返回名冊</button><div class="player-profile">${r.registered?portrait(r.currentRole):`<div class="unknown-portrait">${icon('person')}</div>`}<div><small>${String(id).padStart(2,'0')} 號 · ${esc(p.name||'玩家 '+id)}</small><h3>${esc(r.currentRole)}</h3><p>${r.life==='delayedDeath'?'延後死亡':r.alive?'存活':'已出局'}${id===viewState().sheriff?' · 警長':''}</p></div></div>`;
 if(!r.registered)return body+'<p class="drawer-sub">等待第一夜睜眼認牌；目前不推定陣營或技能。</p>';
 const info=[['勝利陣營',r.alignment],['屠邊歸屬',({wolf:'狼邊',god:'神邊',villager:'民邊',other:'特殊角色',unknown:'未知'})[r.edge]],['原始身分',r.originalRole],['發言資格',r.canSpeak?'保有':'無'],['本輪投票資格',r.canVote?'保有':'無']];
 body+=detailSection('身分與資格',`<dl class="role-facts">${info.map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`);
 if(r.pendingAbilities.length)body+=detailSection('待處理技能',r.pendingAbilities.map(k=>`<p class="pending-detail">${SKILL_LABELS[k.id]||'出局技能'}${k.remaining?' · 剩餘 '+k.remaining+' 次':''}</p>`).join(''));
 body+=detailSection('技能與資源',r.skills.length?`<ul class="role-list">${r.skills.map(k=>`<li><strong>${SKILL_LABELS[k.id]||'特殊技能'}</strong><small>${esc(skillDetailText(k,r))}</small></li>`).join('')}</ul>`:'<p>無主動技能。</p>');
 if(r.learned)body+=detailSection('學習紀錄',`<p>第 ${r.learned.night} 夜 · ${r.learned.id} 號 · ${esc(r.learned.role)}</p><p>目前查驗回報：${esc(r.inspectionRole)}</p>`);
 if(r.progression)body+=detailSection('狼弟進程',`<p>${({waiting:'尚未覺醒',revenge:'本夜使用復仇刀；下一夜加入狼隊',joined:'已加入狼隊共同刀人'})[r.progression]}</p>`);
 body+=detailSection('目前效果',r.effects.length?`<ul class="role-list">${r.effects.map(e=>`<li><strong>${EFFECT_LABELS[e.kind]||'特殊效果'}${e.repeat?' · 連續攝夢':''}</strong><small>${e.source?'來源 '+e.source+' 號 · ':''}第 ${e.starts.round} 夜，至夜間結算${e.blocks?' · 防禦'+e.blocks.map(x=>x==='knife'?'狼刀':'毒藥').join('、'):''}</small></li>`).join('')}</ul>`:'<p class="detail-empty">目前沒有記錄中的暫時效果。</p>');
 body+=detailSection('角色關係',r.relationships.length?`<ul class="role-list">${r.relationships.map(x=>`<li><strong>${({lovers:'戀人',siblings:'兄弟',dreamLink:'攝夢連結'})[x.kind]||'角色關係'}</strong><small>${x.targets.map(n=>esc(who(n))).join('、')}${x.source?' · 來源 '+x.source+' 號':''}</small></li>`).join('')}</ul>`:'<p class="detail-empty">無已記錄關係。</p>');
 if(r.death)body+=detailSection('出局紀錄',`<p>第 ${r.death.round} ${r.death.phase==='night'?'夜':'天'}${r.death.legacy?' · 舊紀錄':''}</p><p>${r.death.factors.map(f=>esc(f.label)).join(' ＋ ')||'死因未記錄'}</p>`);
 body+=detailSection('已告知資訊',r.knowledge.length?`<ul class="role-list">${r.knowledge.slice().reverse().map(k=>`<li><strong>${esc(knowledgeText(k))}</strong><small>第 ${k.round} ${k.phase==='night'?'夜':'天'}</small></li>`).join('')}</ul>`:'<p class="detail-empty">尚無已確認告知的紀錄。</p>');return body;
}
function hostLogMarkup(){const logs=viewState().logs,periods=[...new Set(logs.map(l=>l.period))].reverse();if(hostLogPeriod&&!periods.includes(hostLogPeriod))hostLogPeriod='';const entries=logs.slice().reverse().filter(l=>!hostLogPeriod||l.period===hostLogPeriod);let prior='';return `<div class="log-tools"><label>查看階段<select aria-label="篩選紀錄階段" onchange="hostLogPeriod=this.value;render()"><option value="">全部階段</option>${periods.map(p=>`<option value="${esc(p)}" ${hostLogPeriod===p?'selected':''}>${esc(p)}</option>`).join('')}</select></label><button onclick="download()">匯出完整紀錄</button></div><details class="host-section"><summary>新增主持筆記</summary><textarea id="game-note" placeholder="發言、爭議或現場裁定…" oninput="hostNoteDraft=this.value">${esc(hostNoteDraft)}</textarea><button onclick="saveHostNote()">加入紀錄</button></details><p class="drawer-sub">${entries.length} 筆 · 最新在前</p><div class="story-list">${entries.length?entries.map(l=>{const head=l.period!==prior?`<h3>${esc(l.period)}</h3>`:'';prior=l.period;return head+`<article><small>${esc(l.at)}</small><p>${esc(logText(l))}</p></article>`}).join(''):'<p>尚無這個階段的紀錄。</p>'}</div>`}
function saveHostNote(){const text=hostNoteDraft.trim();if(!text)return;hostNoteDraft='';GameEngine.note(text);render()}
function hostManagementMarkup(){return `<p class="drawer-sub">版本 ${esc(document.querySelector('meta[name="application-version"]')?.content||'開發版')} · ${esc(boardLabel())} · ${saveError?'存檔失敗，請先匯出紀錄':'進度自動儲存在此瀏覽器'}</p><section class="host-section"><h3>發言計時</h3><div class="host-timer" id="timer">${timeText()}</div><div class="timer-controls"><button onclick="ticking=!ticking;render()">${ticking?'暫停':'開始'}</button><button onclick="timer=90;ticking=false;render()">重設 90 秒</button><select aria-label="計時長度" onchange="timer=Number(this.value);ticking=false;render()"><option value="" disabled selected>選擇時長</option>${[60,90,120,180].map(n=>`<option value="${n}">${n} 秒</option>`).join('')}</select></div></section><details class="host-section"><summary>本局配置與規則摘要</summary><p>${esc(boardComposition(viewState().board))}</p><p>${esc(rulesText(viewState().rules,viewState().board))}</p><p>${esc(BOARD_STORIES[viewState().board].text)}</p></details><details class="host-section" ${viewState().phase==='setup'?'open':''}><summary>${viewState().phase==='setup'?'開局設定 · 規則與暱稱':'本回合操作與修正'}</summary><div id="engine-slot"></div></details><details class="host-section"><summary>畫面設定</summary><button onclick="sceneStill=!sceneStill;render()">${sceneStill?'啟用微動態':'切換靜態場景'}</button></details><div class="drawer-foot"><button onclick="undo()" ${viewState().canUndo?'':'disabled'}>撤回上一個已確認操作</button><button onclick="download()">匯出完整紀錄</button></div><div class="new-game-zone"><button onclick="resetFromManagement()">結束本局並開新局</button></div>`}


let mobileRenderKey='';
function restorePlayScroll(key,top){const el=document.querySelector('.play-scroll');if(el)el.scrollTop=key===mobileRenderKey||key.split(':').slice(0,-2).join(':')===mobileRenderKey.split(':').slice(0,-2).join(':')?top:0;mobileRenderKey=key}
function installMobileViewport(){
 if(!window.addEventListener||!document.documentElement)return;
 const update=()=>{const vv=window.visualViewport;if(vv&&vv.scale>1.05)return;const height=vv?.height||window.innerHeight;document.documentElement.style.setProperty('--app-height',height+'px');document.documentElement.style.setProperty('--app-top',(vv?.offsetTop||0)+'px');if(document.activeElement?.matches?.('input,textarea,select'))requestAnimationFrame(()=>document.activeElement?.scrollIntoView?.({block:'nearest',inline:'nearest'}))};
 window.addEventListener('resize',update,{passive:true});window.visualViewport?.addEventListener('resize',update,{passive:true});window.visualViewport?.addEventListener('scroll',update,{passive:true});update();
}
installMobileViewport();

// UI state and rules use the existing hosted game save.
primeRoleImages();render();
</script></body></html>
